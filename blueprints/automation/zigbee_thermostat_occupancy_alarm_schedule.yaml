blueprint:
  name: Zigbee thermostat, occupancy and alarm aware schedule
  description: >-
    Switches a thermostat's active schedule group by occupancy (1 floor
    occupied, 2 floor empty, 3 nobody home). Before the next waking alarm it
    pre-warms the room with the Timer override, then optionally holds a working
    temperature until period 2, the first heating period on the device schedule.
  domain: automation
  source_url: https://raw.githubusercontent.com/jeverley/home-assistant-blueprints/main/blueprints/automation/zigbee_thermostat_occupancy_alarm_schedule.yaml
  homeassistant:
    min_version: 2026.10.0
  input:
    thermostat:
      name: Thermostat entities
      icon: mdi:thermostat
      collapsed: false
      input:
        schedule_group:
          name: Schedule group select
          selector:
            entity:
              filter:
                - domain: select
        operating_day:
          name: Schedule operating day select
          selector:
            entity:
              filter:
                - domain: select
        fetch_button:
          name: Schedule fetch button
          selector:
            entity:
              filter:
                - domain: button
        period_2_entity:
          name: Schedule period 2 time select
          description: Period 1 is fixed at 00:00, so period 2 is the first heating period.
          selector:
            entity:
              filter:
                - domain: select
        override_mode:
          name: Override mode select
          selector:
            entity:
              filter:
                - domain: select
        override_target:
          name: Override target temperature
          selector:
            entity:
              filter:
                - domain: number
        override_period:
          name: Override period
          selector:
            entity:
              filter:
                - domain: number
        override_apply:
          name: Override apply button
          selector:
            entity:
              filter:
                - domain: button
        override_exit:
          name: Override exit button
          selector:
            entity:
              filter:
                - domain: button
        override_state:
          name: Override mode sensor (read only)
          selector:
            entity:
              filter:
                - domain: sensor
    occupancy:
      name: Occupancy
      icon: mdi:home-account
      collapsed: true
      input:
        room_floor:
          name: Floor this thermostat heats
          selector:
            floor: {}
        all_floors:
          name: All floors in the house
          selector:
            floor:
              multiple: true
        home_zone:
          name: Home zone
          default: zone.home
          selector:
            entity:
              filter:
                - domain: zone
        detect_delay:
          name: Occupied delay
          default:
            hours: 0
            minutes: 1
            seconds: 0
          selector:
            duration: {}
        clear_delay:
          name: Empty delay
          default:
            hours: 0
            minutes: 5
            seconds: 0
          selector:
            duration: {}
    prewarm:
      name: Pre-warm and hold
      icon: mdi:alarm
      collapsed: true
      input:
        alarm_sensor:
          name: Next waking alarm sensor
          selector:
            entity:
              filter:
                - domain: sensor
        prewarm_lead:
          name: Pre-warm lead time (minutes before alarm)
          default: 30
          selector:
            number:
              min: 5
              max: 120
              step: 5
              unit_of_measurement: min
              mode: box
        prewarm_target:
          name: Pre-warm temperature
          default: 21
          selector:
            number:
              min: 5
              max: 30
              step: 0.5
              unit_of_measurement: °C
              mode: box
        require_presence:
          name: Require someone on this floor to pre-warm
          description: On for bedrooms. Off for rooms that are empty when the alarm fires.
          default: true
          selector:
            boolean: {}
        hold_enabled:
          name: Hold after the pre-warm until period 2
          default: true
          selector:
            boolean: {}
        hold_target:
          name: Hold temperature
          default: 20
          selector:
            number:
              min: 5
              max: 30
              step: 0.5
              unit_of_measurement: °C
              mode: box
        hold_max:
          name: Maximum hold (minutes)
          default: 90
          selector:
            number:
              min: 15
              max: 1439
              step: 5
              unit_of_measurement: min
              mode: box

mode: queued
max: 10
max_exceeded: silent

trigger_variables:
  alarm_sensor: !input alarm_sensor
  prewarm_lead: !input prewarm_lead

variables:
  period_2_entity: !input period_2_entity
  alarm_sensor: !input alarm_sensor
  require_presence: !input require_presence
  hold_enabled: !input hold_enabled
  hold_max: !input hold_max

triggers:
  - alias: Floor occupied
    trigger: occupancy.detected
    target:
      floor_id: !input room_floor
    options:
      behavior: first
      for: !input detect_delay
  - alias: Floor empty
    trigger: occupancy.cleared
    target:
      floor_id: !input room_floor
    options:
      behavior: all
      for: !input clear_delay
  - alias: All floors empty
    trigger: occupancy.cleared
    target:
      floor_id: !input all_floors
    options:
      behavior: all
      for: !input clear_delay
  - alias: Home zone occupied
    trigger: zone.occupancy_detected
    options:
      for: "00:00:00"
      zone: !input home_zone
  - alias: Home zone empty
    trigger: zone.occupancy_cleared
    options:
      for: "00:00:00"
      zone: !input home_zone
  - alias: Schedule group came back
    trigger: state
    entity_id: !input schedule_group
    from:
      - unavailable
      - unknown
  - alias: Pre-warm before waking alarm
    trigger: template
    id: prewarm
    value_template: >-
      {% set a = states(alarm_sensor) | as_datetime(none) %}
      {{ a is not none and a - timedelta(minutes=prewarm_lead | int) <= now() < a }}
  - alias: Timer override ended
    trigger: state
    id: override-ended
    entity_id: !input override_state
    from: Timer
    to: Idle

conditions: []

actions:
  - alias: Fetch active schedule
    if:
      - condition: trigger
        id:
          - prewarm
          - override-ended
    then:
      - alias: Select today as the operating day
        action: select.select_option
        target:
          entity_id: !input operating_day
        data:
          option: "{{ now().strftime('%A') }}"
      # The press returns once the device has replied, so no wait is needed.
      - alias: Fetch the active schedule
        action: button.press
        target:
          entity_id: !input fetch_button
      - alias: Read period 2, the first heating period (HH:MM, or blank if invalid)
        variables:
          period_2_time: >-
            {% set s = states(period_2_entity) %}
            {{ s[:5] if s is match('^[0-9]{2}:[0-9]{2}') else '' }}
  - choose:
      - alias: Pre-warm before waking alarm
        conditions:
          - condition: trigger
            id: prewarm
          - alias: At least a minute before the alarm and period 2
            condition: template
            value_template: >-
              {% set a = states(alarm_sensor) | as_datetime %}
              {{ period_2_time != ''
                 and (min(a, today_at(period_2_time)) - now()).total_seconds() >= 60 }}
          - alias: No override already running
            condition: not
            conditions:
              - condition: state
                entity_id: !input override_state
                state:
                  - Boost
                  - Timer
          - alias: Someone is on this floor, unless presence is not required
            condition: or
            conditions:
              - condition: template
                value_template: "{{ not require_presence }}"
              - condition: occupancy.is_detected
                target:
                  floor_id: !input room_floor
                options:
                  behavior: any
                  for: "00:00:00"
        sequence:
          - alias: Set override mode to Timer
            action: select.select_option
            target:
              entity_id: !input override_mode
            data:
              option: Timer
          - alias: Set override target temperature
            action: number.set_value
            target:
              entity_id: !input override_target
            data:
              value: !input prewarm_target
          - alias: Set override period until the alarm, or period 2 if sooner
            action: number.set_value
            target:
              entity_id: !input override_period
            data:
              value: >-
                {% set a = states(alarm_sensor) | as_datetime %}
                {% set end = min(a, today_at(period_2_time)) %}
                {{ min(((end - now()).total_seconds() / 60) | round(0) | int, 1439) }}
          - alias: Apply override
            action: button.press
            target:
              entity_id: !input override_apply
      - alias: Hold until period 2
        conditions:
          - alias: Triggered by the override ending
            condition: trigger
            id: override-ended
          - alias: Hold is enabled
            condition: template
            value_template: "{{ hold_enabled }}"
          - alias: Still at least a minute before period 2
            condition: template
            value_template: >-
              {{ period_2_time != ''
                 and (today_at(period_2_time) - now()).total_seconds() >= 60 }}
          - alias: Someone is on this floor
            condition: occupancy.is_detected
            target:
              floor_id: !input room_floor
            options:
              behavior: any
              for: "00:00:00"
        sequence:
          - alias: Set override mode to Timer
            action: select.select_option
            target:
              entity_id: !input override_mode
            data:
              option: Timer
          - alias: Set working temperature
            action: number.set_value
            target:
              entity_id: !input override_target
            data:
              value: !input hold_target
          - alias: Hold until period 2, up to the maximum hold
            action: number.set_value
            target:
              entity_id: !input override_period
            data:
              value: >-
                {{ min(((today_at(period_2_time) - now()).total_seconds() / 60)
                   | round(0) | int, hold_max | int) }}
          - alias: Apply override
            action: button.press
            target:
              entity_id: !input override_apply
      - alias: Floor occupied, Schedule 1
        conditions:
          - condition: occupancy.is_detected
            target:
              floor_id: !input room_floor
            options:
              behavior: any
              for: !input detect_delay
          - alias: No override running
            condition: not
            conditions:
              - condition: state
                entity_id: !input override_state
                state:
                  - Boost
                  - Timer
        sequence:
          - action: select.select_option
            target:
              entity_id: !input schedule_group
            data:
              option: Schedule 1
      - alias: Nobody home, end override and set Schedule 3
        conditions:
          - condition: zone.occupancy_is_not_detected
            options:
              for: "00:00:00"
              zone: !input home_zone
          - condition: occupancy.is_not_detected
            target:
              floor_id: !input all_floors
            options:
              behavior: all
              for: !input clear_delay
        sequence:
          - if:
              - condition: state
                entity_id: !input override_state
                state:
                  - Boost
                  - Timer
            then:
              - alias: End the override
                action: button.press
                target:
                  entity_id: !input override_exit
          - action: select.select_option
            target:
              entity_id: !input schedule_group
            data:
              option: Schedule 3
      - alias: Floor clear, Schedule 2
        conditions:
          - condition: occupancy.is_not_detected
            target:
              floor_id: !input room_floor
            options:
              behavior: all
              for: !input clear_delay
          - alias: No override running
            condition: not
            conditions:
              - condition: state
                entity_id: !input override_state
                state:
                  - Boost
                  - Timer
        sequence:
          - action: select.select_option
            target:
              entity_id: !input schedule_group
            data:
              option: Schedule 2
