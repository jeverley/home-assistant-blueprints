blueprint:
  name: Zigbee thermostat, occupancy and alarm aware schedule
  description: >-
    Switches a thermostat's active schedule group by occupancy (1 occupied,
    2 area empty, 3 nobody home). Before the next waking alarm it pre-warms
    the room with the Timer override, then optionally holds a working
    temperature until the first heating slot on the device schedule.
  domain: automation
  source_url: https://raw.githubusercontent.com/jeverley/home-assistant-blueprints/main/blueprints/automation/zigbee_thermostat_occupancy_alarm_schedule.yaml
  homeassistant:
    min_version: 2026.10.0
  input:
    thermostat:
      name: Thermostat
      icon: mdi:thermostat
      collapsed: false
      input:
        thermostat_device:
          name: Thermostat device
          description: >-
            The TP-WGZBA on ZHA with the tp_wgzba.py quirk. Its schedule and
            override entities are found by their default entity ID endings,
            so keep those (for example select.bedroom_thermostat_schedule_group).
          selector:
            device:
              filter:
                - integration: zha
                  manufacturer: SONOFF
                  model: TP-WGZBA
    occupancy:
      name: Occupancy
      icon: mdi:home-account
      collapsed: true
      input:
        room_target:
          name: Area or floor this thermostat heats
          description: Pick the area the thermostat heats, or its whole floor.
          selector:
            target: {}
        house_target:
          name: All areas or floors in the house
          description: Everywhere that counts as someone being home, as areas or floors.
          selector:
            target: {}
        home_zone:
          name: Home zone
          default: zone.home
          selector:
            entity:
              filter:
                - domain: zone
        detect_delay:
          name: Occupied delay
          default:
            hours: 0
            minutes: 1
            seconds: 0
          selector:
            duration: {}
        clear_delay:
          name: Empty delay
          default:
            hours: 0
            minutes: 5
            seconds: 0
          selector:
            duration: {}
    prewarm:
      name: Pre-warm and hold
      icon: mdi:alarm
      collapsed: true
      input:
        alarm_sensor:
          name: Next waking alarm sensor
          selector:
            entity:
              filter:
                - domain: sensor
        prewarm_lead:
          name: Pre-warm lead time (minutes before alarm)
          default: 30
          selector:
            number:
              min: 5
              max: 120
              step: 5
              unit_of_measurement: min
              mode: box
        prewarm_target:
          name: Pre-warm temperature
          default: 21
          selector:
            number:
              min: 5
              max: 30
              step: 0.5
              unit_of_measurement: °C
              mode: box
        require_presence:
          name: Require someone in this area to pre-warm
          description: On for bedrooms. Off for rooms that are empty when the alarm fires.
          default: true
          selector:
            boolean: {}
        hold_enabled:
          name: Hold after the alarm until the first heating slot
          default: true
          selector:
            boolean: {}
        hold_target:
          name: Hold temperature
          default: 20
          selector:
            number:
              min: 5
              max: 30
              step: 0.5
              unit_of_measurement: °C
              mode: box
        hold_max:
          name: Maximum hold (minutes)
          default: 180
          selector:
            number:
              min: 15
              max: 1439
              step: 5
              unit_of_measurement: min
              mode: box

mode: queued
max: 10
max_exceeded: silent

trigger_variables:
  thermostat_device: !input thermostat_device
  alarm_sensor: !input alarm_sensor
  prewarm_lead: !input prewarm_lead

variables:
  # Entities created by the tp_wgzba.py quirk, matched on the device by
  # domain and default entity ID ending.
  thermostat_entities: "{{ device_entities(thermostat_device) }}"
  schedule_group: >-
    {{ thermostat_entities | select('match', '^select\\..*_schedule_group$') | first | default('') }}
  operating_day: >-
    {{ thermostat_entities | select('match', '^select\\..*_schedule_operating_day$') | first | default('') }}
  fetch_button: >-
    {{ thermostat_entities | select('match', '^button\\..*_schedule_fetch$') | first | default('') }}
  slot2_entity: >-
    {{ thermostat_entities | select('match', '^select\\..*_schedule_period_2_time$') | first | default('') }}
  override_mode: >-
    {{ thermostat_entities | select('match', '^select\\..*_override_mode$') | first | default('') }}
  override_target: >-
    {{ thermostat_entities | select('match', '^number\\..*_override_target_temperature$') | first | default('') }}
  override_period: >-
    {{ thermostat_entities | select('match', '^number\\..*_override_period$') | first | default('') }}
  override_apply: >-
    {{ thermostat_entities | select('match', '^button\\..*_override_apply$') | first | default('') }}
  override_exit: >-
    {{ thermostat_entities | select('match', '^button\\..*_override_exit$') | first | default('') }}
  override_state: >-
    {{ thermostat_entities | select('match', '^sensor\\..*_override_mode$') | first | default('') }}
  alarm_sensor: !input alarm_sensor
  hold_enabled: !input hold_enabled
  hold_max: !input hold_max
  require_presence: !input require_presence

triggers:
  - alias: Area occupied
    trigger: occupancy.detected
    target: !input room_target
    options:
      behavior: first
      for: !input detect_delay
  - alias: Area empty
    trigger: occupancy.cleared
    target: !input room_target
    options:
      behavior: all
      for: !input clear_delay
  - alias: Whole house empty
    trigger: occupancy.cleared
    target: !input house_target
    options:
      behavior: all
      for: !input clear_delay
  - alias: Home zone occupied
    trigger: zone.occupancy_detected
    target:
      entity_id: !input home_zone
    options:
      for: "00:00:00"
  - alias: Home zone empty
    trigger: zone.occupancy_cleared
    target:
      entity_id: !input home_zone
    options:
      for: "00:00:00"
  - alias: Schedule group came back
    trigger: template
    value_template: >-
      {% set e = device_entities(thermostat_device)
           | select('match', '^select\\..*_schedule_group$') | first | default('') %}
      {{ e != '' and states(e) not in ['unavailable', 'unknown'] }}
  - alias: Inside the pre-warm window
    trigger: template
    id: prewarm
    value_template: >-
      {% set a = states(alarm_sensor) | as_datetime(none) %}
      {{ a is not none and a - timedelta(minutes=prewarm_lead | int) <= now() < a }}
  - alias: Timer override ended
    trigger: template
    id: override-ended
    value_template: >-
      {% set e = device_entities(thermostat_device)
           | select('match', '^sensor\\..*_override_mode$') | first | default('') %}
      {{ e != '' and is_state(e, 'Idle') }}

actions:
  - alias: Stop if the device is missing an entity
    if:
      - condition: template
        value_template: >-
          {{ '' in [schedule_group, operating_day, fetch_button, slot2_entity,
                    override_mode, override_target, override_period,
                    override_apply, override_exit, override_state] }}
    then:
      - stop: >-
          Could not find every tp_wgzba.py entity on the thermostat device.
          Check the entity IDs still end with their default names.
        error: true
  - variables:
      # The template trigger fires on any change to Idle; only Timer counts.
      timer_ended: >-
        {{ trigger.id == 'override-ended' and trigger.from_state is not none
           and trigger.from_state.state == 'Timer' }}
  - alias: Read the first heating slot from the device
    if:
      - condition: template
        value_template: "{{ trigger.id == 'prewarm' or timer_ended }}"
    then:
      - action: select.select_option
        target:
          entity_id: "{{ operating_day }}"
        data:
          option: "{{ now().strftime('%A') }}"
      - action: button.press
        target:
          entity_id: "{{ fetch_button }}"
      - wait_template: >-
          {{ states[slot2_entity].last_reported >= states(fetch_button) | as_datetime }}
        timeout: "00:00:10"
        continue_on_timeout: false
      - variables:
          slot_time: >-
            {% set s = states(slot2_entity) %}
            {{ s[:5] if s is match('^[0-9]{2}:[0-9]{2}') else '' }}
  - choose:
      - alias: Pre-warm before the alarm
        conditions:
          - condition: trigger
            id: prewarm
          - condition: template
            value_template: >-
              {% set a = states(alarm_sensor) | as_datetime(none) %}
              {{ a is not none and slot_time != ''
                 and (min(a, today_at(slot_time)) - now()).total_seconds() >= 60 }}
          - condition: template
            value_template: "{{ states(override_state) not in ['Boost', 'Timer'] }}"
          - condition: or
            conditions:
              - condition: template
                value_template: "{{ not require_presence }}"
              - condition: occupancy.is_detected
                target: !input room_target
                options:
                  behavior: any
                  for: "00:00:00"
          - condition: zone.occupancy_is_detected
            target:
              entity_id: !input home_zone
            options:
              for: "00:00:00"
        sequence:
          - action: select.select_option
            target:
              entity_id: "{{ override_mode }}"
            data:
              option: Timer
          - action: number.set_value
            target:
              entity_id: "{{ override_target }}"
            data:
              value: !input prewarm_target
          - action: number.set_value
            target:
              entity_id: "{{ override_period }}"
            data:
              value: >-
                {% set a = states(alarm_sensor) | as_datetime %}
                {% set end = min(a, today_at(slot_time)) %}
                {{ min(((end - now()).total_seconds() / 60) | round(0) | int, 1439) }}
          - action: button.press
            target:
              entity_id: "{{ override_apply }}"
      - alias: Hold until the first heating slot
        conditions:
          - condition: template
            value_template: "{{ timer_ended and hold_enabled }}"
          - condition: template
            value_template: >-
              {{ slot_time != '' and (today_at(slot_time) - now()).total_seconds() >= 60 }}
          - condition: occupancy.is_detected
            target: !input room_target
            options:
              behavior: any
              for: "00:00:00"
        sequence:
          - action: select.select_option
            target:
              entity_id: "{{ override_mode }}"
            data:
              option: Timer
          - action: number.set_value
            target:
              entity_id: "{{ override_target }}"
            data:
              value: !input hold_target
          - action: number.set_value
            target:
              entity_id: "{{ override_period }}"
            data:
              value: >-
                {{ min(((today_at(slot_time) - now()).total_seconds() / 60) | round(0) | int, hold_max | int) }}
          - action: button.press
            target:
              entity_id: "{{ override_apply }}"
      - alias: Area occupied, use Schedule 1
        conditions:
          - condition: occupancy.is_detected
            target: !input room_target
            options:
              behavior: any
              for: !input detect_delay
          - condition: template
            value_template: "{{ states(override_state) not in ['Boost', 'Timer'] }}"
        sequence:
          - action: select.select_option
            target:
              entity_id: "{{ schedule_group }}"
            data:
              option: Schedule 1
      - alias: Nobody home, use Schedule 3
        conditions:
          - condition: zone.occupancy_is_not_detected
            target:
              entity_id: !input home_zone
            options:
              for: !input clear_delay
          - condition: occupancy.is_not_detected
            target: !input house_target
            options:
              behavior: all
              for: !input clear_delay
        sequence:
          - if:
              - condition: template
                value_template: "{{ states(override_state) in ['Boost', 'Timer'] }}"
            then:
              - action: button.press
                target:
                  entity_id: "{{ override_exit }}"
          - action: select.select_option
            target:
              entity_id: "{{ schedule_group }}"
            data:
              option: Schedule 3
      - alias: Area empty, use Schedule 2
        conditions:
          - condition: occupancy.is_not_detected
            target: !input room_target
            options:
              behavior: all
              for: !input clear_delay
          - condition: template
            value_template: "{{ states(override_state) not in ['Boost', 'Timer'] }}"
        sequence:
          - action: select.select_option
            target:
              entity_id: "{{ schedule_group }}"
            data:
              option: Schedule 2
