blueprint:
  name: Octopus Energy - Join Weekend Happy Hour Event
  description: >
    Automatically joins Octoplus Weekend Happy Hour events when they become available.
    Octopus Energy only allows one Weekend Happy Hour booking per day, so events on a day that already
    has a booked weekend event are skipped instead of being retried on every update.
    A booking the API still refuses is caught, so the automation does not log an error and the actions
    only run once an event has been joined.
    Based on the Octopus Energy integration's own blueprint by BottlecapDave.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  source_url: https://raw.githubusercontent.com/jeverley/home-assistant-blueprints/refs/heads/main/blueprints/automation/octopus_energy_join_weekend_happy_hour_event.yaml
  input:
    power_up_events_entity:
      name: Power up events
      description: >
        The power up events entity that exposes the available Weekend Happy Hour events
        (e.g. event.octopus_energy_{{ACCOUNT_ID}}_octoplus_power_up_events). It is disabled by default, so enable it first.
      selector:
        entity:
          filter:
            - domain: event
              integration: octopus_energy
    weekend_happy_hours_entity:
      name: Weekend happy hours
      description: >
        The sensor showing how many Weekend Happy Hours are available to use
        (e.g. sensor.octopus_energy_{{ACCOUNT_ID}}_octoplus_weekend_happy_hours)
      selector:
        entity:
          filter:
            - domain: sensor
              integration: octopus_energy
    event_selection:
      name: Event selection
      description: Whether to join the earliest or latest available event
      default: earliest
      selector:
        select:
          options:
            - label: Earliest
              value: earliest
            - label: Latest
              value: latest
    actions:
      name: Actions
      description: >
        Notifications or similar to run once an event has been joined. {{ message }} holds an example message.
      default: []
      selector:
        action: {}

mode: single
max_exceeded: silent

variables:
  power_up_events_entity: !input power_up_events_entity
  weekend_happy_hours_entity: !input weekend_happy_hours_entity
  event_selection: !input event_selection
  # Weekend Happy Hours only run on Saturdays and Sundays (weekday 5 and 6).
  weekend_days: [5, 6]
  # Days from today on that already have a booked weekend event. Octopus Energy allows one booking per day.
  booked_days: >-
    {% set today = now().date() | string %}
    {% set ns = namespace(days=[]) %}
    {% for event in state_attr(power_up_events_entity, 'events') | default([], true) %}
      {% set start = event.start | as_datetime | as_local if event.start is not none else none %}
      {% if start is not none and start.weekday() in weekend_days and (start.date() | string) >= today %}
        {% set ns.days = ns.days + [start.date() | string] %}
      {% endif %}
    {% endfor %}
    {{ ns.days | unique | list }}
  # The event to join: the earliest or latest bookable one, or none when there is nothing to book.
  selected_event: >-
    {% set ns = namespace(events=[]) %}
    {% for event in state_attr(power_up_events_entity, 'available_events') | default([], true) %}
      {% set start = event.start | as_datetime | as_local if event.start is not none else none %}
      {% if start is not none
        and event.code not in [none, '']
        and (event.availability | default('', true) | lower) != 'full'
        and start.weekday() in weekend_days
        and (start.date() | string) not in booked_days %}
        {% set ns.events = ns.events + [{'code': event.code | string, 'start': start.isoformat(), 'duration_in_minutes': event.duration_in_minutes}] %}
      {% endif %}
    {% endfor %}
    {{ (ns.events | sort(attribute='start', reverse=(event_selection == 'latest')) | first) if ns.events else none }}

triggers:
  - trigger: state
    entity_id:
      - !input power_up_events_entity
      - !input weekend_happy_hours_entity

conditions:
  - condition: template
    value_template: "{{ (states(weekend_happy_hours_entity) | int(0)) > 0 and selected_event is mapping }}"

actions:
  # Checked again here because Run actions skips the conditions above.
  - alias: Stop if there is no weekend happy hour left to book
    condition: template
    value_template: "{{ (states(weekend_happy_hours_entity) | int(0)) > 0 and selected_event is mapping }}"
  - variables:
      message: >-
        {% set start = selected_event.start | as_datetime %}
        Joined a new Octopus Energy Weekend Happy Hour event. It starts at {{ start.strftime('%H:%M') }} on {{ start.day }}/{{ start.month }} for {{ selected_event.duration_in_minutes | int(0) }} minutes.
  - alias: Join the event, catching a booking the API refuses
    action: octopus_energy.join_octoplus_weekend_happy_hour_event
    continue_on_error: true
    target:
      entity_id: !input power_up_events_entity
    data:
      event_code: "{{ selected_event.code }}"
    response_variable: join_result
  - alias: Stop quietly if the event could not be joined
    condition: template
    value_template: "{{ join_result is defined and join_result.success | default(false) }}"
  - choose: []
    default: !input actions
