blueprint:
  name: Sonoff TP-WGZBA smart schedule
  description: |
    Smart scheduling for a Sonoff TP-WGZBA thermostat on ZHA, using the schedules stored on the thermostat.

    **Home/Away** switches the thermostat between its schedule groups:
    - **Schedule 1** while the heated areas are occupied.
    - **Schedule 2** when the heated areas are empty. A running Boost or Timer override is left alone. With **Room occupancy** off, Schedule 1 is used whenever someone is home.
    - **Schedule 3** when nobody is home. Any running override is ended first.
    - **Geofencing:** while nobody is home, someone heading home and close switches it to the pre-heat group early.

    **Routine** moves the start of the morning heating to match the next waking alarm:
    - An **early alarm** starts today's schedule early, at its own temperatures.
    - A **late alarm** keeps the night temperature until shortly before it.
    - Someone **up early**, reported by the awake sensor, starts it straight away, alarm or not.

    At **bedtime**, when the awake sensor reports everyone asleep, the evening setback starts early.
  domain: automation
  source_url: https://raw.githubusercontent.com/jeverley/home-assistant-blueprints/main/blueprints/automation/sonoff_tp_wgzba_smart_schedule.yaml
  homeassistant:
    min_version: 2026.10.0
  input:
    thermostat:
      name: Thermostat
      icon: mdi:thermostat
      collapsed: false
      input:
        thermostat_device:
          name: Thermostat device
          description: The thermostat whose schedule this automation manages.
          selector:
            device:
              filter:
                - integration: zha
                  manufacturer: SONOFF
                  model: TP-WGZBA
        heated_areas:
          name: Heated areas
          description: The areas this thermostat heats.
          selector:
            area:
              multiple: true
        state_helper:
          name: State helper
          description: |
            Where the blueprint keeps its working state, such as the running routine stage and what comes next, so it can carry on after a restart or while the schedule is being edited.

            Create a **Text** helper under **Settings > Devices & services > Helpers**:
            - Set its **Maximum length** to 255.
            - Use it for this thermostat only.
          selector:
            entity:
              filter:
                - domain: input_text

    home_away:
      name: Home/Away
      icon: mdi:home-account
      description: |
        Who is home, and how long to wait before switching schedule group.

        **Geofencing** heats up before someone gets home.
      collapsed: false
      input:
        occupancy_enabled:
          name: Room occupancy
          description: |
            Uses Schedule 1 while the heated areas are occupied and Schedule 2 when they are empty.

            When off, Schedule 1 is used whenever someone is home.
          default: true
          selector:
            boolean: {}
        home_areas:
          name: Home areas
          description: The areas that count as someone being home.
          selector:
            area:
              multiple: true
        home_zone:
          name: Home zone
          description: The zone that shows whether anyone is home.
          default: zone.home
          selector:
            entity:
              filter:
                - domain: zone
        detect_delay:
          name: Occupied delay
          description: The duration the heated areas must be occupied before switching to Schedule 1.
          default:
            hours: 0
            minutes: 1
            seconds: 0
          selector:
            duration: {}
        clear_delay:
          name: Empty delay
          description: The duration areas must be empty before switching to Schedule 2, or to Schedule 3 when nobody is home.
          default:
            hours: 0
            minutes: 5
            seconds: 0
          selector:
            duration: {}
        geofencing_distance:
          name: Geofencing distance
          description: |
            While nobody is home, pre-heats once someone heading home is within this distance.

            Uses the **Proximity** integration for the home zone. Set to 0 to turn this off.
          default: 5
          selector:
            number:
              min: 0
              max: 100
              step: 0.5
              unit_of_measurement: km
              mode: box
        geofencing_group:
          name: Pre-heat schedule group
          description: The schedule group to use while someone is on their way home.
          default: Schedule 2
          selector:
            select:
              options:
                - Schedule 1
                - Schedule 2
        geofencing_timeout:
          name: Geofencing timeout
          description: >-
            If nobody is home this long after pre-heating started, go back to
            Schedule 3.
          default: 30
          selector:
            number:
              min: 5
              max: 180
              step: 5
              unit_of_measurement: min
              mode: box
        proximity_devices:
          name: Proximity
          description: |
            Normally found automatically: the Proximity entry named after the home zone.

            Pick it here only if it is not found, for example after renaming the zone.
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: proximity
        arriving_sensors:
          name: Arriving sensor
          description: |
            Optional binary sensors or toggles that turn on when someone is on their way home, such as a travel time helper.

            Used as well as Proximity. Set the geofencing distance to 0 to use only these.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - binary_sensor
                    - input_boolean
    routine:
      name: Routine
      icon: mdi:alarm
      description: |
        Follows your day rather than the clock:
        - **Early alarm** and **Late alarm** move the morning heating to match the next waking alarm.
        - **Getting up** starts it as soon as someone is up.
        - **Bedtime** starts the night temperature early when everyone goes to bed.

        It only runs while someone is home.
      collapsed: false
      input:
        alarm_sensor:
          name: Next waking alarm sensor
          description: The sensor with the time of the next waking alarm, such as a phone's next alarm sensor.
          selector:
            entity:
              filter:
                - domain: sensor
        prewarm_lead:
          name: Lead time
          description: The time before the alarm when the morning heating starts.
          default: 30
          selector:
            number:
              min: 5
              max: 120
              step: 5
              unit_of_measurement: min
              mode: box
        early_alarm_enabled:
          name: Early alarm
          description: When the alarm is earlier than the schedule, starts the morning heating that much earlier.
          default: true
          selector:
            boolean: {}
        late_alarm_enabled:
          name: Late alarm
          description: When the alarm is later than the schedule, keeps the night temperature until shortly before it.
          default: true
          selector:
            boolean: {}
        awake_sensors:
          name: Awake sensor
          description: |
            A binary sensor or toggle that is **on while anyone is up** and **off once everyone is asleep**, such as a helper built from your motion sensors.

            It must tell a night-time trip from getting up for the day by itself.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - binary_sensor
                    - input_boolean
        wake_enabled:
          name: Getting up
          description: When the awake sensor turns on, starts the morning heating straight away, as for an early alarm.
          default: true
          selector:
            boolean: {}
        wake_duration:
          name: Getting up delay
          description: |
            How long the awake sensor must stay on before someone counts as up.

            Leave at zero if the sensor already accounts for this.
          default:
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration: {}
        bedtime_enabled:
          name: Bedtime
          description: |
            When the awake sensor turns off, starts the schedule's night temperature early.

            It ends again if someone gets up before the usual time.
          default: true
          selector:
            boolean: {}
        sleep_delay:
          name: Bedtime delay
          description: How long the awake sensor must stay off before everyone counts as asleep.
          default:
            hours: 0
            minutes: 15
            seconds: 0
          selector:
            duration: {}

mode: queued
max: 10
max_exceeded: silent

trigger_variables:
  thermostat_device: !input thermostat_device
  alarm_sensor: !input alarm_sensor
  prewarm_lead: !input prewarm_lead
  awake_sensors: !input awake_sensors
  state_helper: !input state_helper
  home_zone: !input home_zone
  geofencing_distance: !input geofencing_distance
  geofencing_timeout: !input geofencing_timeout
  proximity_devices: !input proximity_devices
  arriving_sensors: !input arriving_sensors

variables:
  # The thermostat's ZHA entities, matched on the device by domain and
  # default entity ID ending.
  thermostat_entities: "{{ device_entities(thermostat_device) }}"
  schedule_group: >-
    {{ thermostat_entities | select('match', '^select\\..*_schedule_group$') | first | default('') }}
  operating_day: >-
    {{ thermostat_entities | select('match', '^select\\..*_schedule_operating_day$') | first | default('') }}
  fetch_button: >-
    {{ thermostat_entities | select('match', '^button\\..*_schedule_fetch$') | first | default('') }}
  period_entities: >-
    {{ thermostat_entities
       | select('match', '^(select|number)\\..*_schedule_period_[0-9]+_(time|temp)$') | list }}
  override_mode: >-
    {{ thermostat_entities | select('match', '^select\\..*_override_mode$') | first | default('') }}
  override_target: >-
    {{ thermostat_entities | select('match', '^number\\..*_override_target_temperature$') | first | default('') }}
  override_period: >-
    {{ thermostat_entities | select('match', '^number\\..*_override_period$') | first | default('') }}
  override_apply: >-
    {{ thermostat_entities | select('match', '^button\\..*_override_apply$') | first | default('') }}
  override_exit: >-
    {{ thermostat_entities | select('match', '^button\\..*_override_exit$') | first | default('') }}
  override_state: >-
    {{ thermostat_entities | select('match', '^sensor\\..*_override_mode$') | first | default('') }}
  heated_areas: !input heated_areas
  home_areas: !input home_areas
  occupancy_enabled: !input occupancy_enabled
  early_alarm_enabled: !input early_alarm_enabled
  late_alarm_enabled: !input late_alarm_enabled
  wake_enabled: !input wake_enabled
  bedtime_enabled: !input bedtime_enabled
  sleep_delay: !input sleep_delay

# Trigger templates cannot use the variables above, so the ones that need a
# thermostat entity repeat its matching. Keep them in step.
triggers:
  - alias: Heated areas occupied
    trigger: occupancy.detected
    target:
      area_id: !input heated_areas
    options:
      behavior: first
      for: !input detect_delay
  - alias: Heated areas empty
    trigger: occupancy.cleared
    target:
      area_id: !input heated_areas
    options:
      behavior: all
      for: !input clear_delay
  - alias: Home areas empty
    trigger: occupancy.cleared
    target:
      area_id: !input home_areas
    options:
      behavior: all
      for: !input clear_delay
  - alias: Home zone occupied
    trigger: zone.occupancy_detected
    options:
      for: "00:00:00"
      zone: !input home_zone
  - alias: Home zone empty
    trigger: zone.occupancy_cleared
    options:
      for: "00:00:00"
      zone: !input home_zone
  - alias: Schedule group came back
    trigger: template
    value_template: >-
      {% set e = device_entities(thermostat_device)
           | select('match', '^select\\..*_schedule_group$') | first | default('') %}
      {{ e != '' and states(e) not in ['unavailable', 'unknown'] }}
  - alias: Early start window opened
    trigger: template
    id: prewarm
    value_template: >-
      {% set a = states(alarm_sensor) | as_datetime(none) %}
      {{ a is not none and a - timedelta(minutes=prewarm_lead | int) <= now() < a }}
  # Reads the period 2 time from the last fetch, so it can fire just before
  # period 2 starts when the alarm is later than usual. It is only true in the
  # minute before period 2, so it fires again if a fetch moves period 2 later.
  - alias: Late start hold due
    trigger: template
    id: late-hold
    value_template: >-
      {% set a = states(alarm_sensor) | as_datetime(none) %}
      {% set p = device_entities(thermostat_device)
           | select('match', '^select\\..*_schedule_period_2_time$') | first | default('') %}
      {% set s = states(p) if p != '' else '' %}
      {% if a is none or s is not match('^[0-9]{2}:[0-9]{2}') %}{{ false }}{% else %}
      {% set start = (a | as_local) - timedelta(minutes=prewarm_lead | int) %}
      {% set p2 = today_at(s[:5]) %}
      {{ start.date() == now().date() and p2 < start
         and p2 - timedelta(minutes=1) <= now() < p2 }}
      {% endif %}
  # Any awake sensor on, held for the getting up delay.
  - alias: Someone is up
    trigger: template
    id: wake
    value_template: "{{ awake_sensors | select('is_state', 'on') | list | count > 0 }}"
    for: !input wake_duration
  # Every awake sensor off, held for the bedtime delay.
  - alias: Everyone asleep
    trigger: template
    id: asleep
    value_template: >-
      {{ awake_sensors | count > 0
         and awake_sensors | select('is_state', 'off') | list | count == awake_sensors | count }}
    for: !input sleep_delay
  # Any change to Idle. Whether to continue is decided from the plan in the
  # Routine state helper, so this run does not need to know what changed.
  - alias: Timer override ended
    trigger: template
    id: override-ended
    value_template: >-
      {% set e = device_entities(thermostat_device)
           | select('match', '^sensor\\..*_override_mode$') | first | default('') %}
      {{ e != '' and is_state(e, 'Idle') }}
  # The early or late window may already be open when Home Assistant starts or
  # automations reload, so the template triggers above would not fire.
  - alias: Home Assistant started
    trigger: homeassistant
    id: catch-up
    event: start
  - alias: Automations reloaded
    trigger: event
    id: catch-up
    event_type: automation_reloaded
  # Fires 5 minutes after the last edit to the schedule's operating day or
  # periods, so runs deferred while it was edited catch up. Keep this in step
  # with the editing variable.
  - alias: Schedule editing finished
    trigger: template
    id: catch-up
    value_template: >-
      {% set ents = device_entities(thermostat_device) %}
      {% set watched = expand((ents | select('match', '^select\\..*_schedule_operating_day$') | list)
           + (ents | select('match', '^(select|number)\\..*_schedule_period_[0-9]+_(time|temp)$') | list)) %}
      {% set raw = states(state_helper) %}
      {% set f = (raw | from_json).fetch | default(0) | int if raw is match('^\\{') else 0 %}
      {% set ns = namespace(n=0) %}
      {% for s in watched %}
        {% set t = s.last_changed.timestamp() %}
        {% if t > now().timestamp() - 300 and not (f > 0 and f - 10 <= t <= f + 60) %}
          {% set ns.n = ns.n + 1 %}
        {% endif %}
      {% endfor %}
      {{ not (0 < ns.n < (watched | count) / 2) }}
  # Requested by this automation after a schedule group change.
  - alias: Catch-up requested
    trigger: event
    id: catch-up
    event_type: sonoff_tp_wgzba_smart_schedule_catch_up
    event_data:
      device_id: "{{ thermostat_device }}"
  # Someone is heading home and close, from Proximity's per-person distance
  # and direction sensors for the home zone, or an arriving sensor. Keep this
  # in step with the heading_home variable.
  - alias: Someone heading home
    trigger: template
    id: heading-home
    value_template: >-
      {% set ns = namespace(on=false, ents=[]) %}
      {% for e in arriving_sensors %}{% if is_state(e, 'on') %}{% set ns.on = true %}{% endif %}{% endfor %}
      {% if geofencing_distance | float(0) > 0 %}
        {% if proximity_devices | count > 0 %}
          {% for d in proximity_devices %}{% set ns.ents = ns.ents + device_entities(d) %}{% endfor %}
        {% else %}
          {% set zone_name = state_attr(home_zone, 'friendly_name') %}
          {% for e in integration_entities('proximity') %}
            {% if device_attr(e, 'name') == zone_name %}{% set ns.ents = ns.ents + [e] %}{% endif %}
          {% endfor %}
        {% endif %}
        {% for d in ns.ents | select('match', '^sensor\\..*_distance$') | reject('search', '_nearest_distance$') %}
          {% set km = states(d) | float(none) %}
          {% set to_km = {'m': 0.001, 'km': 1, 'mi': 1.609344, 'yd': 0.0009144, 'ft': 0.0003048} %}
          {% if km is not none and is_state(d[:-9] ~ '_direction_of_travel', 'towards')
                and km * to_km.get(state_attr(d, 'unit_of_measurement'), 1) <= geofencing_distance | float(0) %}
            {% set ns.on = true %}
          {% endif %}
        {% endfor %}
      {% endif %}
      {{ ns.on }}
  # The geofencing timeout has passed since pre-heating started.
  - alias: Geofencing timed out
    trigger: template
    id: geofencing-timeout
    value_template: >-
      {% set raw = states(state_helper) %}
      {% set a = (raw | from_json).arrival | default(0) | int if raw is match('^\\{') else 0 %}
      {{ a > 0 and now().timestamp() >= a + geofencing_timeout | int * 60 }}
  # Refreshes the fetched schedule for the new day, for the late start trigger.
  - alias: New day
    trigger: time
    id: new-day
    at: "00:01:00"

conditions: []

actions:
  - alias: Stop if the device is missing an entity
    if:
      - condition: template
        value_template: >-
          {{ '' in [schedule_group, operating_day, fetch_button, override_mode,
                    override_target, override_period, override_apply,
                    override_exit, override_state] }}
    then:
      - stop: >-
          Could not find every schedule and override entity on the thermostat. Check the
          entity IDs still end with their default names.
        error: true
  - alias: Stop if no heated or home areas are set
    if:
      - condition: template
        value_template: "{{ heated_areas | count == 0 or home_areas | count == 0 }}"
    then:
      - stop: Set at least one heated area and one home area.
        error: true
  - variables:
      # The trigger id. A run without one (Run actions in the UI) is a catch-up.
      run: >-
        {{ trigger.id if trigger is defined and trigger.id is defined and trigger.id else 'catch-up' }}
      # The blueprint's working state, kept as JSON in the State helper, one key
      # per feature. Writes merge into it, so other keys are kept.
      #   fetch: when our last fetch started.
      #   routine: the running stage, when it should end, and the next stage's
      #   temperature and end.
      #   arrival: when geofencing pre-heating started.
      # Times are Unix epoch seconds, 0 when unset.
      state: >-
        {% set raw = states(state_helper) %}
        {{ raw | from_json if raw is match('^\\{') else {} }}
      plan: >-
        {% set r = state.routine | default({}) %}
        {{ {'stage': r.stage | default(''), 'ends': r.ends | default(0) | int,
            'next_temp': r.next_temp | default(none), 'next_until': r.next_until | default(0) | int} }}
      # The schedule is being edited: some, but under half, of the operating
      # day and period entities changed in the last 5 minutes, other than
      # through our own fetch (10 s before to 60 s after it started). A person
      # edits a value or two; a fetch, restart or rejoin changes them all. Keep
      # this in step with the Schedule editing finished trigger.
      editing: >-
        {% set f = state.fetch | default(0) | int %}
        {% set watched = expand([operating_day] + period_entities) %}
        {% set ns = namespace(n=0) %}
        {% for s in watched %}
          {% set t = s.last_changed.timestamp() %}
          {% if t > now().timestamp() - 300 and not (f > 0 and f - 10 <= t <= f + 60) %}
            {% set ns.n = ns.n + 1 %}
          {% endif %}
        {% endfor %}
        {{ 0 < ns.n < (watched | count) / 2 }}
      # Someone is heading home and close. Keep this in step with the Someone
      # heading home trigger.
      heading_home: >-
        {% set ns = namespace(on=false, ents=[]) %}
        {% for e in arriving_sensors %}{% if is_state(e, 'on') %}{% set ns.on = true %}{% endif %}{% endfor %}
        {% if geofencing_distance | float(0) > 0 %}
          {% if proximity_devices | count > 0 %}
            {% for d in proximity_devices %}{% set ns.ents = ns.ents + device_entities(d) %}{% endfor %}
          {% else %}
            {% set zone_name = state_attr(home_zone, 'friendly_name') %}
            {% for e in integration_entities('proximity') %}
              {% if device_attr(e, 'name') == zone_name %}{% set ns.ents = ns.ents + [e] %}{% endif %}
            {% endfor %}
          {% endif %}
          {% for d in ns.ents | select('match', '^sensor\\..*_distance$') | reject('search', '_nearest_distance$') %}
            {% set km = states(d) | float(none) %}
            {% set to_km = {'m': 0.001, 'km': 1, 'mi': 1.609344, 'yd': 0.0009144, 'ft': 0.0003048} %}
            {% if km is not none and is_state(d[:-9] ~ '_direction_of_travel', 'towards')
                  and km * to_km.get(state_attr(d, 'unit_of_measurement'), 1) <= geofencing_distance | float(0) %}
              {% set ns.on = true %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.on }}
      # Geofencing pre-heating started at this time, and is still within its
      # timeout.
      arrival: "{{ state.arrival | default(0) | int }}"
      preheating: "{{ arrival > 0 and now().timestamp() < arrival + geofencing_timeout | int * 60 }}"
      # When the override last went Idle (0 unless Idle now). A restart or
      # rejoin makes this later, never earlier.
      idle_since: >-
        {% set o = expand(override_state) | first %}
        {{ o.last_changed.timestamp() | int if o.state == 'Idle' else 0 }}
      # The routine stage chosen below: a Timer at stage_temp for stage_minutes,
      # after ending the running override first if stage_exit is true, with the
      # next stage (if any) to record in the routine plan.
      stage: ""
      stage_temp: 0
      stage_minutes: 0
      stage_exit: false
      next_temp: null
      next_until: 0
  # Someone got home, or pre-heating timed out and nobody is heading home any
  # more, so the arrival is over.
  - alias: Finish a geofencing arrival
    if:
      - condition: template
        value_template: >-
          {{ arrival > 0 and (states(home_zone) | int(0) > 0 or (not preheating and not heading_home)) }}
    then:
      - variables:
          state: "{{ dict(state, arrival=0) }}"
          arrival: 0
          preheating: false
      - action: input_text.set_value
        target:
          entity_id: "{{ state_helper }}"
        data:
          value: "{{ state | to_json }}"
  # Our stage ended more than 2 minutes before it should have, so someone
  # cancelled it (in the UI, on the thermostat or with a Boost). Drop the plan.
  - alias: Forget a cancelled plan
    if:
      - condition: template
        value_template: >-
          {{ idle_since > 0 and plan.ends > 0 and idle_since < plan.ends - 120 }}
    then:
      - action: input_text.set_value
        target:
          entity_id: "{{ state_helper }}"
        data:
          value: "{{ dict(state, routine={}) | to_json }}"
      - variables:
          plan: "{{ {'stage': '', 'ends': 0, 'next_temp': none, 'next_until': 0} }}"
  # Our stage ended as planned and a next stage is due, so continue the plan.
  # This needs nothing from the schedule, so it also runs while it is edited.
  - alias: Continue the plan
    if:
      - condition: template
        value_template: >-
          {{ idle_since > 0 and plan.ends > 0 and plan.next_until > 0 and plan.next_temp is not none
             and idle_since >= plan.ends - 120
             and plan.next_until - now().timestamp() >= 60 }}
      - alias: Someone is in the home areas
        condition: occupancy.is_detected
        target:
          area_id: !input home_areas
        options:
          behavior: any
          for: "00:00:00"
    then:
      - variables:
          stage: next
          stage_temp: "{{ plan.next_temp }}"
          stage_minutes: >-
            {{ min(((plan.next_until - now().timestamp()) / 60) | round(0) | int, 1439) }}
  # While the schedule is being edited its selects cannot be trusted, and a
  # fetch would replace the day being edited. Whether a stage is due decides
  # whether a schedule group change is right, so nothing else is decided: the
  # run defers, and the Schedule editing finished trigger catches up.
  - alias: Defer while the schedule is being edited
    if:
      - condition: template
        value_template: "{{ stage == '' and editing }}"
    then:
      - stop: >-
          Deferred: the schedule is being edited in the UI. A catch-up runs 5 minutes
          after the last change.
  # Fetch today's schedule for the active group on runs that plan a stage from
  # it. The start time is recorded first, so its changes are not taken for an
  # edit. Errors are tolerated: the selects still hold today's schedule from
  # the new day fetch, and if the thermostat is not answering, applying a stage
  # fails too.
  - alias: Fetch today's schedule
    if:
      - condition: template
        value_template: >-
          {{ stage == '' and run in ['prewarm', 'late-hold', 'wake', 'asleep', 'catch-up', 'new-day'] }}
    then:
      - variables:
          state: "{{ dict(state, fetch=now().timestamp() | int) }}"
      - action: input_text.set_value
        target:
          entity_id: "{{ state_helper }}"
        data:
          value: "{{ state | to_json }}"
      - alias: Select today as the operating day
        continue_on_error: true
        action: select.select_option
        target:
          entity_id: "{{ operating_day }}"
        data:
          option: "{{ now().strftime('%A') }}"
      # The press returns once the device has replied, so no wait is needed.
      - alias: Fetch the active schedule
        continue_on_error: true
        action: button.press
        target:
          entity_id: "{{ fetch_button }}"
  - alias: Read the schedule and the alarm
    variables:
      # Periods in order as {time, temp}, stopping at the first unset (NULL)
      # time. Period 1 is fixed at 00:00. A missing temperature is none.
      periods: >-
        {% set ns = namespace(out=[], open=true) %}
        {% for i in range(1, 13) %}
          {% set t = period_entities | select('search', '_schedule_period_' ~ i ~ '_time$') | first | default('') %}
          {% set p = period_entities | select('search', '_schedule_period_' ~ i ~ '_temp$') | first | default('') %}
          {% set s = states(t) if t != '' else '' %}
          {% if ns.open and s is match('^[0-9]{2}:[0-9]{2}') %}
            {% set ns.out = ns.out + [{'time': s[:5], 'temp': states(p) | float(none)}] %}
          {% else %}
            {% set ns.open = false %}
          {% endif %}
        {% endfor %}
        {{ ns.out }}
      # With 4 or more periods, period 3 is daytime heating, so an early start
      # shifts the morning earlier. With 2 or 3, period 3 (if any) is the
      # evening setback, so period 2 is only started early.
      shift: "{{ periods | count >= 4 }}"
      # Any awake sensor is on.
      wake_on: "{{ awake_sensors | select('is_state', 'on') | list | count > 0 }}"
      # Someone is up, and wake-ups are turned on. Its trigger only fires when
      # an awake sensor turns on, so catch-up and late start runs also count
      # one that is already on.
      woke: >-
        {{ wake_enabled and (run == 'wake' or (run in ['catch-up', 'late-hold'] and wake_on)) }}
      # Everyone has been asleep long enough (every awake sensor off
      # for at least the bedtime delay).
      asleep: >-
        {% set sensors = expand(awake_sensors) %}
        {% set d = sleep_delay %}
        {% set delay = (d.hours | default(0)) * 3600 + (d.minutes | default(0)) * 60 + (d.seconds | default(0)) %}
        {{ sensors | count > 0
           and sensors | selectattr('state', 'eq', 'off') | list | count == sensors | count
           and sensors | selectattr('last_changed', 'gt', now() - timedelta(seconds=delay)) | list | count == 0 }}
      # The evening setback still ahead today: the last period with 3 or more
      # periods, or period 1 again at midnight with 2. Blank time if none.
      setback: >-
        {% if periods | count >= 3 and today_at(periods[-1].time) > now() %}
        {{ {'temp': periods[-1].temp, 'until': today_at(periods[-1].time).isoformat()} }}
        {% elif periods | count == 2 %}
        {{ {'temp': periods[0].temp, 'until': (today_at('00:00') + timedelta(days=1)).isoformat()} }}
        {% else %}{{ {'temp': none, 'until': ''} }}{% endif %}
      # The temperature of the period running now.
      current_temp: >-
        {% set ns = namespace(t=none) %}
        {% for p in periods %}{% if today_at(p.time) <= now() %}{% set ns.t = p.temp %}{% endif %}{% endfor %}
        {{ ns.t }}
      # Alarm minus lead time, when the alarm is today and still ahead.
      # Otherwise blank.
      alarm_start: >-
        {% set a = states(alarm_sensor) | as_datetime(none) %}
        {% if a is none %}{{ '' }}{% else %}
        {% set a = a | as_local %}
        {% set start = a - timedelta(minutes=prewarm_lead | int) %}
        {{ start.isoformat() if start.date() == now().date() and now() < a else '' }}
        {% endif %}
      # The routine start: now if someone is up before the alarm start (or
      # with no alarm), otherwise the alarm start.
      routine_start: >-
        {% if woke and (alarm_start == '' or now() < alarm_start | as_datetime) %}{{ now().isoformat() }}{% else %}{{ alarm_start }}{% endif %}
  - alias: Choose the wake-up stage
    if:
      - condition: template
        value_template: "{{ stage == '' }}"
    then:
      - choose:
          - alias: Someone got up during the bedtime cool-down, end it
            conditions:
              - condition: template
                value_template: >-
                  {{ bedtime_enabled and run in ['wake', 'catch-up'] and wake_on
                     and is_state(override_state, 'Timer') and plan.stage == 'bedtime'
                     and plan.ends > 0 and now().timestamp() < plan.ends }}
            sequence:
              - variables:
                  stage: bedtime-end
                  stage_exit: true
                  stage_minutes: 0
          - alias: Everyone asleep, start the evening setback early
            conditions:
              - alias: Everyone has been asleep long enough
                condition: template
                value_template: "{{ bedtime_enabled and run in ['asleep', 'catch-up'] and asleep }}"
              - alias: The setback is at least a minute away and cooler than now
                condition: template
                value_template: >-
                  {{ setback.until != '' and setback.temp is not none and current_temp is not none
                     and current_temp > setback.temp
                     and ((setback.until | as_datetime) - now()).total_seconds() >= 60 }}
              - alias: No override already running
                condition: template
                value_template: "{{ states(override_state) not in ['Boost', 'Timer'] }}"
              # Sleepers may not show on occupancy sensors, so check the home
              # zone instead of the home areas.
              - alias: Someone is home
                condition: template
                value_template: "{{ states(home_zone) | int(0) > 0 }}"
            sequence:
              - variables:
                  stage: bedtime
                  stage_temp: "{{ setback.temp }}"
                  stage_minutes: >-
                    {{ min((((setback.until | as_datetime) - now()).total_seconds() / 60) | round(0) | int, 1439) }}
          - alias: Early alarm or someone up, start period 2 early
            conditions:
              - alias: The wake-up start has been reached
                condition: template
                value_template: >-
                  {{ ((run in ['prewarm', 'catch-up'] and early_alarm_enabled) or woke) and routine_start != ''
                     and (routine_start | as_datetime) <= now() }}
              - alias: Period 2 is set and warmer than period 1
                condition: template
                value_template: >-
                  {{ periods | count >= 2
                     and periods[0].temp is not none and periods[1].temp is not none
                     and periods[1].temp > periods[0].temp
                     and (not shift or periods[2].temp is not none) }}
              - alias: At least a minute before period 2
                condition: template
                value_template: >-
                  {{ (today_at(periods[1].time) - now()).total_seconds() >= 60 }}
              - alias: No override already running
                condition: template
                value_template: "{{ states(override_state) not in ['Boost', 'Timer'] }}"
              - alias: Someone is in the home areas
                condition: occupancy.is_detected
                target:
                  area_id: !input home_areas
                options:
                  behavior: any
                  for: "00:00:00"
            sequence:
              # Shift: run period 2 for its usual length from the routine
              # start, then period 3 until its usual start. Otherwise: run
              # period 2 until its usual start.
              - variables:
                  stage: early
                  stage_temp: "{{ periods[1].temp }}"
                  stage_minutes: >-
                    {% set start = routine_start | as_datetime %}
                    {% set p2 = today_at(periods[1].time) %}
                    {% set end = start + (today_at(periods[2].time) - p2) if shift else p2 %}
                    {{ min(((end - now()).total_seconds() / 60) | round(0) | int, 1439) }}
                  next_temp: "{{ periods[2].temp if shift else none }}"
                  next_until: "{{ today_at(periods[2].time).timestamp() | int if shift else 0 }}"
          - alias: Late alarm, hold period 1 past period 2's start
            conditions:
              - alias: Triggered for a late start, and nobody is up yet
                condition: template
                value_template: >-
                  {{ late_alarm_enabled and run in ['late-hold', 'catch-up'] and not woke and routine_start != '' }}
              - alias: Period 2 is set and warmer than period 1
                condition: template
                value_template: >-
                  {{ periods | count >= 2
                     and periods[0].temp is not none and periods[1].temp is not none
                     and periods[1].temp > periods[0].temp }}
              - alias: Period 2 is due, and the wake-up start is at least a minute later
                condition: template
                value_template: >-
                  {% set start = routine_start | as_datetime %}
                  {% set p2 = today_at(periods[1].time) %}
                  {{ p2 < start and now() >= p2 - timedelta(minutes=1)
                     and (start - now()).total_seconds() >= 60 }}
              - alias: No override already running
                condition: template
                value_template: "{{ states(override_state) not in ['Boost', 'Timer'] }}"
              - alias: Someone is in the home areas
                condition: occupancy.is_detected
                target:
                  area_id: !input home_areas
                options:
                  behavior: any
                  for: "00:00:00"
            sequence:
              # Hold until the routine start. With 4 or more periods, period 2
              # then runs for its usual length, never past period 4.
              - variables:
                  stage: late-hold
                  stage_temp: "{{ periods[0].temp }}"
                  stage_minutes: >-
                    {% set start = routine_start | as_datetime %}
                    {{ min(((start - now()).total_seconds() / 60) | round(0) | int, 1439) }}
                  next_temp: "{{ periods[1].temp if shift else none }}"
                  next_until: >-
                    {% if shift %}
                    {% set end = (routine_start | as_datetime) + (today_at(periods[2].time) - today_at(periods[1].time)) %}
                    {{ min(end, today_at(periods[3].time)).timestamp() | int }}
                    {% else %}0{% endif %}
          - alias: Someone up during a late hold, end it
            conditions:
              - condition: template
                value_template: "{{ woke }}"
              - alias: Our late hold is running
                condition: template
                value_template: >-
                  {{ is_state(override_state, 'Timer') and plan.stage == 'late-hold'
                     and plan.ends > 0 and now().timestamp() < plan.ends
                     and periods | count >= 2 and periods[1].temp is not none }}
              - alias: Someone is in the home areas
                condition: occupancy.is_detected
                target:
                  area_id: !input home_areas
                options:
                  behavior: any
                  for: "00:00:00"
            sequence:
              # With 2 or 3 periods the device's period 2 carries on once the
              # hold ends. With 4 or more, run period 2 for its usual length
              # from now, never past period 4.
              - variables:
                  stage: wake-in-hold
                  stage_exit: true
                  stage_temp: "{{ periods[1].temp }}"
                  stage_minutes: >-
                    {% if not shift %}0{% else %}
                    {% set end = now() + (today_at(periods[2].time) - today_at(periods[1].time)) %}
                    {{ min(((min(end, today_at(periods[3].time)) - now()).total_seconds() / 60) | round(0) | int, 1439) }}
                    {% endif %}
  - alias: Apply the wake-up stage, or switch schedule group
    if:
      - condition: template
        value_template: "{{ stage != '' }}"
    then:
      - alias: End the running override first
        if:
          - condition: template
            value_template: "{{ stage_exit }}"
        then:
          - alias: End the override
            action: button.press
            target:
              entity_id: "{{ override_exit }}"
          - wait_template: "{{ is_state(override_state, 'Idle') }}"
            timeout: "00:00:30"
            continue_on_timeout: true
      # Record the plan before applying, so a run that sees the new Timer end
      # knows what it was and what comes next.
      - alias: Record the plan
        action: input_text.set_value
        target:
          entity_id: "{{ state_helper }}"
        data:
          value: >-
            {% set routine = {
                 'stage': stage,
                 'ends': (now().timestamp() + stage_minutes * 60) | int,
                 'next_temp': next_temp,
                 'next_until': next_until | int} if stage_minutes >= 1 else {} %}
            {{ dict(state, routine=routine) | to_json }}
      - alias: Start the stage as a Timer override
        if:
          - condition: template
            value_template: "{{ stage_minutes >= 1 }}"
        then:
          - alias: Set override mode to Timer
            action: select.select_option
            target:
              entity_id: "{{ override_mode }}"
            data:
              option: Timer
          - alias: Set the stage temperature
            action: number.set_value
            target:
              entity_id: "{{ override_target }}"
            data:
              value: "{{ stage_temp }}"
          - alias: Set the stage length
            action: number.set_value
            target:
              entity_id: "{{ override_period }}"
            data:
              value: "{{ stage_minutes }}"
          - alias: Apply override
            action: button.press
            target:
              entity_id: "{{ override_apply }}"
          - wait_template: "{{ is_state(override_state, 'Timer') }}"
            timeout: "00:00:30"
            continue_on_timeout: true
    else:
      - variables:
          group_before: "{{ states(schedule_group) }}"
      - choose:
          - alias: Nobody home but someone heading home, pre-heat
            conditions:
              - condition: zone.occupancy_is_not_detected
                options:
                  for: "00:00:00"
                  zone: !input home_zone
              - condition: occupancy.is_not_detected
                target:
                  area_id: !input home_areas
                options:
                  behavior: all
                  for: !input clear_delay
              - alias: Heading home now, or pre-heating within its timeout
                condition: template
                value_template: "{{ preheating or (arrival == 0 and heading_home) }}"
            sequence:
              - alias: Record when pre-heating started
                if:
                  - condition: template
                    value_template: "{{ arrival == 0 }}"
                then:
                  - action: input_text.set_value
                    target:
                      entity_id: "{{ state_helper }}"
                    data:
                      value: "{{ dict(state, arrival=now().timestamp() | int) | to_json }}"
              - action: select.select_option
                target:
                  entity_id: "{{ schedule_group }}"
                data:
                  option: !input geofencing_group
          - alias: Nobody home, end override and set Schedule 3
            conditions:
              - condition: zone.occupancy_is_not_detected
                options:
                  for: "00:00:00"
                  zone: !input home_zone
              - condition: occupancy.is_not_detected
                target:
                  area_id: !input home_areas
                options:
                  behavior: all
                  for: !input clear_delay
            sequence:
              - alias: Drop the plan
                action: input_text.set_value
                target:
                  entity_id: "{{ state_helper }}"
                data:
                  value: "{{ dict(state, routine={}) | to_json }}"
              - if:
                  - condition: template
                    value_template: "{{ states(override_state) in ['Boost', 'Timer'] }}"
                then:
                  - alias: End the override
                    action: button.press
                    target:
                      entity_id: "{{ override_exit }}"
              - action: select.select_option
                target:
                  entity_id: "{{ schedule_group }}"
                data:
                  option: Schedule 3
          # After the nobody-home branches, so Schedule 1 never applies to an
          # empty house when room occupancy is off.
          - alias: Heated areas occupied (or room occupancy off), Schedule 1
            conditions:
              - condition: or
                conditions:
                  - condition: template
                    value_template: "{{ not occupancy_enabled }}"
                  - condition: occupancy.is_detected
                    target:
                      area_id: !input heated_areas
                    options:
                      behavior: any
                      for: !input detect_delay
              - alias: No override running
                condition: template
                value_template: "{{ states(override_state) not in ['Boost', 'Timer'] }}"
            sequence:
              - action: select.select_option
                target:
                  entity_id: "{{ schedule_group }}"
                data:
                  option: Schedule 1
          - alias: Heated areas clear, Schedule 2
            conditions:
              - condition: template
                value_template: "{{ occupancy_enabled }}"
              - condition: occupancy.is_not_detected
                target:
                  area_id: !input heated_areas
                options:
                  behavior: all
                  for: !input clear_delay
              - alias: No override running
                condition: template
                value_template: "{{ states(override_state) not in ['Boost', 'Timer'] }}"
            sequence:
              - action: select.select_option
                target:
                  entity_id: "{{ schedule_group }}"
                data:
                  option: Schedule 2
      # Each group has its own periods. After a switch with a late alarm still
      # ahead, request a catch-up: that run fetches the new group's schedule
      # and applies a late hold if its window is now open.
      - alias: Catch up after a group change
        if:
          - condition: template
            value_template: >-
              {{ states(schedule_group) != group_before
                 and alarm_start != '' and now() < alarm_start | as_datetime }}
        then:
          - event: sonoff_tp_wgzba_smart_schedule_catch_up
            event_data:
              device_id: "{{ thermostat_device }}"
