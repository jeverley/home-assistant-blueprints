blueprint:
  name: Sonoff TP-WGZBA smart schedule
  description: |
    Smart scheduling for a Sonoff TP-WGZBA thermostat on ZHA, using the schedules stored on the thermostat.

    **Occupancy** switches the thermostat between its schedule groups:
    - **Schedule 1** while the heated areas are occupied.
    - **Schedule 2** when the heated areas are empty.
    - With **Follow occupancy** off or no heated areas, **Schedule 1** whenever someone is home.
    - A switch waits for your own **Boost** or **Timer** override to end.

    **Geofencing** follows whether anyone is home:
    - **Away schedule** uses **Schedule 3** while nobody is home, ending any running override as it switches.
    - It pre-heats, switching to the pre-heat group early, when someone is close and heading home.

    **Routine** follows your day rather than the clock:
    - An **early alarm** starts the morning heating early.
    - A **late alarm** delays the morning heating.
    - **Getting up** starts the morning heating as soon as an awake sensor reports someone up.
    - **Bedtime** starts the night temperature early once the awake sensors report everyone asleep.

    Each stage is a **Timer** override worked out from the active group's schedule, so it follows a group change.
  domain: automation
  source_url: https://raw.githubusercontent.com/jeverley/home-assistant-blueprints/main/blueprints/automation/sonoff_tp_wgzba_smart_schedule.yaml
  homeassistant:
    min_version: 2026.10.0
  input:
    thermostat:
      name: Thermostat
      icon: mdi:thermostat
      collapsed: false
      input:
        thermostat_device:
          name: Thermostat device
          description: The thermostat whose schedule this automation manages.
          selector:
            device:
              filter:
                - integration: zha
                  manufacturer: SONOFF
                  model: TP-WGZBA
        state_helper:
          name: State helper
          description: |
            Keeps the blueprint's working state, such as the routine's plan, so it carries on after a restart or while the schedule is being edited.

            Create a **Text** helper under **Settings > Devices & services > Helpers**:
            - Set its **Maximum length** to 255.
            - Use it for this thermostat only.
          selector:
            entity:
              filter:
                - domain: input_text

    occupancy:
      name: Occupancy
      icon: mdi:home-account
      description: Switches between Schedule 1 and Schedule 2 as the heated areas become occupied or empty.
      collapsed: true
      input:
        follow_occupancy:
          name: Follow occupancy
          description: |
            Uses Schedule 1 while the heated areas are occupied and Schedule 2 when they are empty.

            When off, or with no heated areas, uses Schedule 1 whenever someone is home.
          default: true
          selector:
            boolean: {}
        heated_areas:
          name: Heated areas
          description: The areas this thermostat heats, used by **Follow occupancy**.
          default: []
          selector:
            area:
              multiple: true
        occupied_delay:
          name: Occupied delay
          description: The duration the heated areas must be occupied before switching to Schedule 1.
          default:
            hours: 0
            minutes: 1
            seconds: 0
          selector:
            duration: {}
        empty_delay:
          name: Empty delay
          description: |
            The duration the heated areas must be empty before switching to Schedule 2.

            Also how long every area must be empty before nobody counts as home, for **Away schedule**.
          default:
            hours: 0
            minutes: 5
            seconds: 0
          selector:
            duration: {}
    geofencing:
      name: Geofencing
      icon: mdi:map-marker-radius
      description: Uses Schedule 3 while nobody is home, and pre-heats before someone gets home.
      collapsed: true
      input:
        away_enabled:
          name: Away schedule
          description: |
            Uses Schedule 3 while nobody is home (the home zone is empty and no area is occupied). Any running override is ended as it switches, and one started while away is left alone.

            Pre-heats by switching to the pre-heat schedule group when someone is on their way home.

            When off, **Occupancy** continues to choose the group while nobody is home.
          default: true
          selector:
            boolean: {}
        home_zone:
          name: Home zone
          description: |
            The zone people head home to, used to find its **Proximity** entry.

            It also shows whether anyone is home, for **Away schedule** and **Bedtime**.
          default: zone.home
          selector:
            entity:
              filter:
                - domain: zone
        geofencing_distance:
          name: Geofencing distance
          description: |
            Pre-heats once someone heading home is within this distance. Allow roughly the distance you travel in the time your heating takes to warm up.

            Uses the **Proximity** integration for the home zone. Set to 0 to pre-heat from the arriving sensors only.
          default: 10
          selector:
            number:
              min: 0
              max: 100
              step: 0.5
              unit_of_measurement: km
              mode: box
        geofencing_group:
          name: Pre-heat schedule group
          description: The schedule group to use while someone is on their way home.
          default: Schedule 2
          selector:
            select:
              options:
                - Schedule 1
                - Schedule 2
        geofencing_timeout:
          name: Geofencing timeout
          description: |
            Switches back to Schedule 3 if nobody is home this long after pre-heating started.

            Allow for the slowest trip home from the geofencing distance.
          default: 45
          selector:
            number:
              min: 5
              max: 180
              step: 5
              unit_of_measurement: min
              mode: box
        proximity_devices:
          name: Proximity devices (optional)
          description: |
            The Proximity entry named after the home zone is normally found automatically.

            Pick it here only if it isn't, for example after renaming the zone.
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: proximity
        arriving_sensors:
          name: Arriving sensors (optional)
          description: |
            Binary sensors or toggles that turn on when someone is on their way home, such as a travel time helper.

            Used as well as Proximity.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - binary_sensor
                    - input_boolean
    routine:
      name: Routine
      icon: mdi:alarm
      description: |
        Follows your day rather than the clock:
        - **Early alarm** and **Late alarm** move the morning heating to match the next waking alarm.
        - **Getting up** starts it as soon as someone is up.
        - **Bedtime** starts the night temperature early when everyone goes to bed.

        It only runs while someone is home.
      collapsed: true
      input:
        alarm_sensor:
          name: Next waking alarm sensor (optional)
          description: |
            The sensor with the time of the next waking alarm, such as a phone's next alarm sensor.

            Needed for **Early alarm** and **Late alarm**. **Getting up** and **Bedtime** work without it.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        early_alarm_enabled:
          name: Early alarm
          description: Starts the morning heating early when the alarm is earlier than the schedule.
          default: true
          selector:
            boolean: {}
        late_alarm_enabled:
          name: Late alarm
          description: Delays the morning heating when the alarm is later than the schedule.
          default: true
          selector:
            boolean: {}
        awake_sensors:
          name: Awake sensors (optional)
          description: |
            Binary sensors or toggles that are **on while anyone is up** and **off once everyone is asleep**, such as a helper built from your motion sensors. Any one on counts as someone up, and all off as everyone asleep.

            Make it **unknown** when it can't tell, for example in the middle of the night or during the day. Only on and off are acted on.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - binary_sensor
                    - input_boolean
        getting_up_enabled:
          name: Getting up
          description: Starts the morning heating as soon as an awake sensor reports someone up.
          default: true
          selector:
            boolean: {}
        getting_up_delay:
          name: Getting up delay
          description: |
            How long an awake sensor must stay on before someone counts as up.

            Leave at zero if the sensor already accounts for this.
          default:
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration: {}
        bedtime_enabled:
          name: Bedtime
          description: |
            Starts the night temperature early once the awake sensors report everyone asleep.

            It ends again if someone gets up before the usual time.
          default: true
          selector:
            boolean: {}
        bedtime_delay:
          name: Bedtime delay
          description: How long every awake sensor must stay off before everyone counts as asleep.
          default:
            hours: 0
            minutes: 15
            seconds: 0
          selector:
            duration: {}
    early_start:
      name: Early start
      icon: mdi:clock-fast
      description: |
        Learns how long each room takes to warm up, from the mornings the routine or the thermostat's own schedule starts, allowing for how cold the room is. Until two mornings have been measured, an alarm morning starts at the alarm.

        The learned time also starts **Early alarm** mornings and late holds that long before the alarm.
      collapsed: true
      input:
        early_start_enabled:
          name: Early start
          description: |
            Starts the heating early for each period warmer than the one before, so the room is warm when it begins. On a morning with an alarm, the alarm decides instead.

            Needs a learned warm-up time, so nothing starts early before then.
          default: false
          selector:
            boolean: {}

mode: queued
max: 25
max_exceeded: silent

trigger_variables:
  thermostat_device: !input thermostat_device
  alarm_sensor: !input alarm_sensor
  early_start_enabled: !input early_start_enabled
  awake_sensors: !input awake_sensors
  state_helper: !input state_helper
  home_zone: !input home_zone
  away_enabled: !input away_enabled
  geofencing_distance: !input geofencing_distance
  geofencing_timeout: !input geofencing_timeout
  proximity_devices: !input proximity_devices
  arriving_sensors: !input arriving_sensors

variables:
  # The thermostat's ZHA entities, matched on the device by domain and
  # default entity ID ending.
  thermostat_entities: "{{ device_entities(thermostat_device) }}"
  schedule_group: >-
    {{ thermostat_entities | select('match', '^select\\..*_schedule_group$') | first | default('') }}
  operating_day: >-
    {{ thermostat_entities | select('match', '^select\\..*_schedule_operating_day$') | first | default('') }}
  fetch_button: >-
    {{ thermostat_entities | select('match', '^button\\..*_schedule_fetch$') | first | default('') }}
  period_entities: >-
    {{ thermostat_entities
       | select('match', '^(select|number)\\..*_schedule_period_[0-9]+_(time|temp)$') | list }}
  override_mode: >-
    {{ thermostat_entities | select('match', '^select\\..*_override_mode$') | first | default('') }}
  override_target: >-
    {{ thermostat_entities | select('match', '^number\\..*_override_target_temperature$') | first | default('') }}
  override_period: >-
    {{ thermostat_entities | select('match', '^number\\..*_override_period$') | first | default('') }}
  override_apply: >-
    {{ thermostat_entities | select('match', '^button\\..*_override_apply$') | first | default('') }}
  override_exit: >-
    {{ thermostat_entities | select('match', '^button\\..*_override_exit$') | first | default('') }}
  override_state: >-
    {{ thermostat_entities | select('match', '^sensor\\..*_override_mode$') | first | default('') }}
  work_mode_state: >-
    {{ thermostat_entities | select('match', '^sensor\\..*_device_work_mode_state$') | first | default('') }}
  # For learning the warm-up time. The hvac action sensor ends each
  # measurement, so it is required.
  climate_entity: >-
    {{ thermostat_entities | select('match', '^climate\\.') | first | default('') }}
  hvac_action_sensor: >-
    {{ thermostat_entities | select('match', '^sensor\\..*_hvac_action$') | first | default('') }}
  room_temp: >-
    {{ state_attr(climate_entity, 'current_temperature') | float(none) if climate_entity != '' else none }}
  # The thermostat stops heating this far above its target (its heating high
  # threshold), 0.2 if it cannot be read, and starts again this far from it
  # (its heating low threshold, negative), -0.6 if it cannot be read.
  high_threshold: >-
    {% set e = thermostat_entities | select('match', '^number\\..*_heating_high_threshold$') | first | default('') %}
    {{ states(e) | float(0.2) if e != '' else 0.2 }}
  low_threshold: >-
    {% set e = thermostat_entities | select('match', '^number\\..*_heating_low_threshold$') | first | default('') %}
    {{ states(e) | float(-0.6) if e != '' else -0.6 }}
  heated_areas: !input heated_areas
  follow_occupancy: !input follow_occupancy
  early_alarm_enabled: !input early_alarm_enabled
  late_alarm_enabled: !input late_alarm_enabled
  getting_up_enabled: !input getting_up_enabled
  bedtime_enabled: !input bedtime_enabled
  getting_up_delay: !input getting_up_delay
  bedtime_delay: !input bedtime_delay
  empty_delay: !input empty_delay
  # The delays in seconds. A duration input is a dict from the UI, or a
  # string or number of seconds in YAML.
  delay_secs: >-
    {%- macro secs(d) -%}
      {%- if d is string -%}{{ as_timedelta(d).total_seconds() }}
      {%- elif d is mapping -%}{{ (d.days | default(0)) * 86400 + (d.hours | default(0)) * 3600
           + (d.minutes | default(0)) * 60 + (d.seconds | default(0)) }}
      {%- else -%}{{ d | float(0) }}{%- endif -%}
    {%- endmacro -%}
    {{ {'getting_up': secs(getting_up_delay) | float(0), 'bedtime': secs(bedtime_delay) | float(0),
        'empty': secs(empty_delay) | float(0)} }}
  # Timings in seconds used in more than one place. The Schedule editing
  # finished trigger cannot read variables, so it repeats the first three.
  #   fetch_grace: a fetch's own changes land within this after it starts.
  #   editing_window: schedule changes this recent may be an edit in progress.
  #   burst_span: changes this close together are a restart or rejoin.
  #   min_stage: the shortest override period, so the shortest stage.
  #   exit_window: our own Exit press lands within this after we record it.
  #   morning_max: the longest period 2 that counts as a morning.
  fetch_grace: 60
  editing_window: 300
  burst_span: 30
  min_stage: 60
  exit_window: 60
  morning_max: 10800
  # Learning the warm-up time (see Learn the warm-up time and Fit the warm-up
  # time). Times in minutes unless given in seconds.
  #   memory: each earlier morning counts this much less with each new one.
  #   min_rise: the smallest rise measured, in degrees.
  #   max_minutes: a longer warm-up is not counted.
  #   read_within: seconds after the idle a measurement must be read in, as
  #     the room keeps rising after the heating stops.
  #   restart: seconds after the start that heating starting again means the
  #     idle was missed.
  #   near_stop: degrees below the stop point that still count as reaching it,
  #     as the reported room temperature lags the thermostat's own.
  #   regroup_margin: seconds after the idle that a group change still counts.
  #   start_window: seconds after the start or period 2 a measurement may
  #     start, so a queued run still counts.
  #   rate: the minutes per degree assumed until the rises spread out.
  #   pull: how strongly the fit is drawn towards that rate.
  #   min_rate, max_rate, max_dead: the fit's limits.
  #   min_weight: the weight two measured mornings reach.
  learning:
    memory: 0.8
    min_rise: 0.5
    max_minutes: 240
    read_within: 600
    restart: 300
    near_stop: 0.3
    regroup_margin: 60
    start_window: 300
    rate: 15
    pull: 4
    min_rate: 3
    max_rate: 60
    max_dead: 120
    min_weight: 1.5
  # Nobody is home: the home zone is empty, and no area is occupied or has
  # been for the empty delay. The zone is checked first, so the areas are only
  # looked at when it is empty. Area sensors are occupancy sensors in any
  # area, including those whose device is in the area, so someone in any
  # area, even the garden, is home. Keep them in step with the Every area
  # empty trigger. A zone not yet known (at startup) counts as
  # someone home. An unavailable area sensor counts as empty, so a dead
  # sensor cannot keep the house occupied.
  nobody_home: >-
    {% set z = states(home_zone) %}
    {% if z in ['unknown', 'unavailable'] or z | int(0) > 0 %}{{ false }}{% else %}
    {% set ns = namespace(ok=true) %}
    {% set area_sensors = areas() | map('area_entities') | flatten | select('contains', 'binary_sensor.')
         | select('is_state_attr', 'device_class', 'occupancy') | unique | list %}
    {% for s in expand(area_sensors) %}
      {% if s.state == 'on' or (s.state == 'off' and (now() - s.last_changed).total_seconds() < delay_secs['empty']) %}
        {% set ns.ok = false %}
      {% endif %}
    {% endfor %}
    {{ ns.ok }}
    {% endif %}

# Trigger templates cannot use the variables above, so the ones that need a
# thermostat entity repeat its matching. Keep them in step.
triggers:
  - alias: Heated areas occupied
    trigger: occupancy.detected
    target:
      area_id: !input heated_areas
    options:
      behavior: first
      for: !input occupied_delay
  - alias: Heated areas empty
    trigger: occupancy.cleared
    target:
      area_id: !input heated_areas
    options:
      behavior: all
      for: !input empty_delay
  # No occupancy sensor in any area is on. It only reads the areas' sensors,
  # so other binary sensors changing do not re-render it. Keep this in step
  # with the nobody_home variable.
  - alias: Every area empty
    trigger: template
    value_template: >-
      {{ areas() | map('area_entities') | flatten | select('contains', 'binary_sensor.')
         | select('is_state_attr', 'device_class', 'occupancy') | select('is_state', 'on')
         | first is not defined }}
    for: !input empty_delay
  - alias: Home zone occupied
    trigger: zone.occupancy_detected
    options:
      for: "00:00:00"
      zone: !input home_zone
  - alias: Home zone empty
    trigger: zone.occupancy_cleared
    options:
      for: "00:00:00"
      zone: !input home_zone
  # The thermostat is back after being unavailable (at startup or after
  # dropping off), so catch up on anything runs skipped or left undone.
  - alias: Thermostat came back
    trigger: template
    id: catch-up
    value_template: >-
      {% set e = device_entities(thermostat_device)
           | select('match', '^select\\..*_schedule_group$') | first | default('') %}
      {{ e != '' and has_value(e) }}
  # The lead is the learned warm-up time once two mornings have been measured,
  # otherwise 5 minutes, so the morning starts at the alarm. Keep this in step
  # with the lead_minutes variable, which explains it, and the Late start hold
  # due trigger. A learned lead shrinks as the room warms, so once today's
  # morning has started this stays true until the alarm, rather than turning
  # false and firing again.
  - alias: Early alarm window opened
    trigger: template
    id: early-alarm
    value_template: >-
      {% set a = states(alarm_sensor) | as_datetime(none) %}
      {% set ents = device_entities(thermostat_device) %}
      {% set c = ents | select('match', '^climate\\.') | first | default('') %}
      {% set t2 = ents | select('match', '^number\\..*_schedule_period_2_temp$') | first | default('') %}
      {% set raw = states(state_helper) %}
      {% set st = raw | from_json(default={}) if raw is match('^\\{') else {} %}
      {% set l = st.l | default({}) %}
      {% set r = st.r | default({}) %}
      {% set rs = r.s | default(0) | int %}
      {% set started = r.k | default('') == 'm' and 0 < rs <= now().timestamp()
           and rs | timestamp_custom('%Y-%m-%d') == now().strftime('%Y-%m-%d') %}
      {% set room = state_attr(c, 'current_temperature') | float(none) if c != '' else none %}
      {% set p2t = states(t2) | float(none) if t2 != '' else none %}
      {% set th = ents | select('match', '^number\\..*_heating_high_threshold$') | first | default('') %}
      {% set hi = states(th) | float(0.2) if th != '' else 0.2 %}
      {% set f = l.f | default([]) %}
      {% set lead = ([[f[0] + f[1] * (p2t + hi - room), 10] | max, 180] | min) | int
           if f | count == 2 and room is not none and p2t is not none else 5 %}
      {{ a is not none and now() < a and (started or a - timedelta(minutes=lead) <= now()) }}
  # Reads the period 2 time from the last fetch, so it can fire just before
  # period 2 starts when the alarm is later than usual. It is only true in the
  # minute before period 2, so it fires again if a fetch moves period 2 later.
  # Keep its period 2 lookup in step with the Period 2 started trigger.
  - alias: Late start hold due
    trigger: template
    id: late-alarm
    value_template: >-
      {% set a = states(alarm_sensor) | as_datetime(none) %}
      {% set ents = device_entities(thermostat_device) %}
      {% set c = ents | select('match', '^climate\\.') | first | default('') %}
      {% set t2 = ents | select('match', '^number\\..*_schedule_period_2_temp$') | first | default('') %}
      {% set raw = states(state_helper) %}
      {% set l = (raw | from_json(default={})).l | default({}) if raw is match('^\\{') else {} %}
      {% set room = state_attr(c, 'current_temperature') | float(none) if c != '' else none %}
      {% set p2t = states(t2) | float(none) if t2 != '' else none %}
      {% set th = ents | select('match', '^number\\..*_heating_high_threshold$') | first | default('') %}
      {% set hi = states(th) | float(0.2) if th != '' else 0.2 %}
      {% set f = l.f | default([]) %}
      {% set lead = ([[f[0] + f[1] * (p2t + hi - room), 10] | max, 180] | min) | int
           if f | count == 2 and room is not none and p2t is not none else 5 %}
      {% set p = ents | select('match', '^select\\..*_schedule_period_2_time$') | first | default('') %}
      {% set s = states(p) if p != '' else '' %}
      {% if a is none or s is not match('^[0-9]{2}:[0-9]{2}') %}{{ false }}{% else %}
      {% set start = (a | as_local) - timedelta(minutes=lead) %}
      {% set p2 = today_at(s[:5]) %}
      {{ start.date() == now().date() and p2 < start
         and p2 - timedelta(minutes=1) <= now() < p2 }}
      {% endif %}
  # Period 2 starts on the thermostat's own schedule, so a morning the
  # routine did not start can be measured too. Reads the period 2 time from
  # the last fetch. Keep its period 2 lookup in step with the Late start hold
  # due trigger.
  - alias: Period 2 started
    trigger: template
    id: period-2
    value_template: >-
      {% set p = device_entities(thermostat_device)
           | select('match', '^select\\..*_schedule_period_2_time$') | first | default('') %}
      {% set s = states(p) if p != '' else '' %}
      {{ s is match('^[0-9]{2}:[0-9]{2}')
         and today_at(s[:5]) <= now() < today_at(s[:5]) + timedelta(minutes=2) }}
  # A period warmer than the one before is within the learned lead of its
  # start, and the room is cool enough for the thermostat to heat for it. Keep
  # this in step with the early_period variable, which explains it. Once that
  # early start has begun this stays true until the period starts, rather than
  # turning false as the room warms and firing again.
  - alias: Early start window opened
    trigger: template
    id: early-start
    value_template: >-
      {% if not early_start_enabled %}{{ false }}{% else %}
      {% set ents = device_entities(thermostat_device) %}
      {% set c = ents | select('match', '^climate\\.') | first | default('') %}
      {% set room = state_attr(c, 'current_temperature') | float(none) if c != '' else none %}
      {% set lt = ents | select('match', '^number\\..*_heating_low_threshold$') | first | default('') %}
      {% set low = states(lt) | float(-0.6) if lt != '' else -0.6 %}
      {% set ht = ents | select('match', '^number\\..*_heating_high_threshold$') | first | default('') %}
      {% set hi = states(ht) | float(0.2) if ht != '' else 0.2 %}
      {% set pents = ents | select('search', '_schedule_period_') | list %}
      {% set raw = states(state_helper) %}
      {% set st = raw | from_json(default={}) if raw is match('^\\{') else {} %}
      {% set f = (st.l | default({})).f | default([]) %}
      {% set r = st.r | default({}) %}
      {% set t = now().timestamp() %}
      {% set ns = namespace(on=r.k | default('') == 'e' and 0 < r.s | default(0) | int <= t < r.w | default(0) | int,
                            prev=none, open=true) %}
      {% if f | count == 2 and room is not none %}
        {% for i in range(1, 13) %}
          {% set te = pents | select('match', '^select\\..*_schedule_period_' ~ i ~ '_time$') | first | default('') %}
          {% set pe = pents | select('match', '^number\\..*_schedule_period_' ~ i ~ '_temp$') | first | default('') %}
          {% set tm = states(te) if te != '' else '' %}
          {% set temp = states(pe) | float(none) if pe != '' else none %}
          {% if ns.open and tm is match('^[0-9]{2}:[0-9]{2}') %}
            {% if ns.prev is not none and temp is not none and temp > ns.prev and room < temp + low %}
              {% set at = today_at(tm[:5]).timestamp() %}
              {% set lead = [[f[0] + f[1] * (temp + hi - room), 10] | max, 180] | min %}
              {% set ns.on = ns.on or at - lead * 60 <= t <= at - 60 %}
            {% endif %}
            {% set ns.prev = temp %}
          {% else %}
            {% set ns.open = false %}
          {% endif %}
        {% endfor %}
      {% endif %}
      {{ ns.on }}
      {% endif %}
  # Any awake sensor on, held for the getting up delay.
  - alias: Someone is up
    trigger: template
    id: getting-up
    value_template: "{{ awake_sensors | select('is_state', 'on') | first is defined }}"
    for: !input getting_up_delay
  # Every awake sensor off, held for the bedtime delay.
  - alias: Everyone asleep
    trigger: template
    id: bedtime
    value_template: >-
      {{ awake_sensors | first is defined
         and awake_sensors | reject('is_state', 'off') | first is not defined }}
    for: !input bedtime_delay
  # Any change to Idle. Whether a next stage is due is worked out from the plan
  # in the State helper, so this run does not need to know what changed.
  - alias: Timer override ended
    trigger: template
    id: override-ended
    value_template: >-
      {% set e = device_entities(thermostat_device)
           | select('match', '^sensor\\..*_override_mode$') | first | default('') %}
      {{ e != '' and is_state(e, 'Idle') }}
  # The thermostat went idle after a warm-up the routine is measuring, so the
  # room has reached its target (or the target dropped). Only true while a
  # measurement is pending, so its everyday top-ups do not start runs.
  - alias: Warmed up
    trigger: template
    id: warmed
    value_template: >-
      {% set h = device_entities(thermostat_device)
           | select('match', '^sensor\\..*_hvac_action$') | first | default('') %}
      {% set raw = states(state_helper) %}
      {% set m = ((raw | from_json(default={})).l | default({})).m | default([]) if raw is match('^\\{') else [] %}
      {{ m | count == 3 and h != '' and is_state(h, 'idle') and states[h].last_changed.timestamp() > m[0] }}
  # The thermostat is back on its schedule after a hand adjustment (at the
  # next period) or manual mode, so the routine picks up where it left off.
  - alias: Back on schedule
    trigger: template
    id: catch-up
    value_template: >-
      {% set e = device_entities(thermostat_device)
           | select('match', '^sensor\\..*_device_work_mode_state$') | first | default('') %}
      {{ e != '' and is_state(e, 'Schedule') }}
  # The early or late window may already be open when Home Assistant starts or
  # automations reload, so the template triggers above would not fire.
  - alias: Home Assistant started
    trigger: homeassistant
    id: catch-up
    event: start
  - alias: Automations reloaded
    trigger: event
    id: catch-up
    event_type: automation_reloaded
  # Fires 5 minutes after the last edit to the schedule's operating day or
  # periods, so runs deferred while it was edited catch up. Keep this in step
  # with the schedule_editing variable: 300, 60 and 30 are its editing_window,
  # fetch_grace and burst_span.
  - alias: Schedule editing finished
    trigger: template
    id: catch-up
    value_template: >-
      {% set ents = device_entities(thermostat_device) %}
      {% set watched = expand((ents | select('match', '^select\\..*_schedule_operating_day$') | list)
           + (ents | select('match', '^(select|number)\\..*_schedule_period_[0-9]+_(time|temp)$') | list)) %}
      {% set raw = states(state_helper) %}
      {% set f = (raw | from_json(default={})).f | default(0) | int if raw is match('^\\{') else 0 %}
      {% set f = f if f <= now().timestamp() else 0 %}
      {% set cut = [now().timestamp() - 300, f + 60] | max %}
      {% set ts = watched | map(attribute='last_changed') | map('as_timestamp') | select('gt', cut) | list %}
      {{ ts | first is not defined
         or (ts | count >= (watched | count) / 2 and ts | max - ts | min <= 30) }}
  # Someone is heading home and close, from Proximity's per-person distance
  # and direction sensors for the home zone, or an arriving sensor. Keep this
  # in step with the heading_home variable.
  - alias: Someone heading home
    trigger: template
    id: heading-home
    value_template: >-
      {% set ns = namespace(on=false, ents=[]) %}
      {% if away_enabled %}
        {% for e in arriving_sensors %}{% if is_state(e, 'on') %}{% set ns.on = true %}{% endif %}{% endfor %}
        {% if proximity_devices %}
          {% for d in proximity_devices %}{% set ns.ents = ns.ents + device_entities(d) %}{% endfor %}
        {% else %}
          {% set zone_name = state_attr(home_zone, 'friendly_name') %}
          {% for e in integration_entities('proximity') %}
            {% if device_attr(e, 'name') == zone_name %}{% set ns.ents = ns.ents + [e] %}{% endif %}
          {% endfor %}
        {% endif %}
        {% for d in ns.ents | select('match', '^sensor\\..*_distance$') | reject('search', '_nearest_distance$') %}
          {% set km = states(d) | float(none) %}
          {% set to_km = {'m': 0.001, 'km': 1, 'mi': 1.609344, 'yd': 0.0009144, 'ft': 0.0003048} %}
          {% if km is not none and is_state(d[:-9] ~ '_direction_of_travel', 'towards')
                and geofencing_distance | float(0) > 0
                and km * to_km.get(state_attr(d, 'unit_of_measurement'), 1) <= geofencing_distance | float(0) %}
            {% set ns.on = true %}
          {% endif %}
        {% endfor %}
      {% endif %}
      {{ ns.on }}
  # The geofencing timeout has passed since pre-heating started.
  - alias: Geofencing timed out
    trigger: template
    id: geofencing-timeout
    value_template: >-
      {% set raw = states(state_helper) %}
      {% set a = (raw | from_json(default={})).a | default(0) | int if raw is match('^\\{') else 0 %}
      {{ a > 0 and now().timestamp() >= a + geofencing_timeout | int * 60 }}
  # Refreshes the fetched schedule for the new day, for the late start trigger.
  - alias: New day
    trigger: time
    id: new-day
    at: "00:01:00"

conditions: []

actions:
  - alias: Stop if the device is missing an entity
    if:
      - condition: template
        value_template: >-
          {% set ents = [schedule_group, operating_day, fetch_button, override_mode,
                         override_target, override_period, override_apply,
                         override_exit, override_state, work_mode_state, hvac_action_sensor] %}
          {{ '' in ents or expand(ents) | count < ents | count }}
    then:
      - stop: >-
          Could not find every schedule, override and HVAC action entity on the
          thermostat. Check they are enabled and their entity IDs still end with their
          default names.
        error: true
  - alias: Stop if the State helper is too short
    if:
      - condition: template
        value_template: "{{ state_attr(state_helper, 'max') | int(255) < 255 }}"
    then:
      - stop: >-
          The State helper's maximum length must be 255. Change it under Settings >
          Devices & services > Helpers.
        error: true
  # The thermostat is not ready yet (at startup or after dropping off), so
  # nothing is written, fetched or decided. Checked when the run starts, so
  # queued runs and Run actions are covered too.
  - alias: Stop if the thermostat is not available
    if:
      - condition: template
        value_template: "{{ not has_value(schedule_group) }}"
    then:
      - stop: The thermostat is not available yet. A catch-up runs once it is back.
  - variables:
      # Follow occupancy is on and has at least one heated area to follow.
      following_occupancy: "{{ follow_occupancy and heated_areas | first is defined }}"
      # The trigger id. A run without one (Run actions in the UI) is a catch-up.
      run: >-
        {{ trigger.id if trigger is defined and trigger.id is defined and trigger.id else 'catch-up' }}
      # The blueprint's working state, kept as JSON in the State helper, one key
      # per feature:
      #   fetch: when our last fetch started.
      #   routine: the plan, see below.
      #   arrival: when geofencing pre-heating started.
      #   learn: the learned warm-up time, see Learn the warm-up time.
      # Times are Unix epoch seconds, 0 when unset. The helper is the only
      # copy: state holds its keys other than routine, plan holds the routine,
      # and the save step writes both back before any thermostat call that
      # depends on them and at the end. Writing an unchanged value changes
      # nothing. A thermostat call that fails stops the run, and what was
      # written lets a later run pick up from there. The helper stores each key
      # as one letter (f, r, a, l, and in the plan k, s, w, u, t, p, x and c,
      # with kind m, b or e and cancelled 1) to fit its 255 characters, and stored
      # reads them back as these names.
      stored: >-
        {% set raw = states(state_helper) %}
        {% set j = raw | from_json(default={}) if raw is match('^\\{') else {} %}
        {% set names = {'k': 'kind', 's': 'start', 'w': 'wake', 'u': 'until', 't': 'temp', 'p': 'applied',
                        'x': 'exited', 'c': 'cancelled'} %}
        {% set ns = namespace(r={}) %}
        {% for k, v in (j.r | default({})).items() if k in names %}
          {% set ns.r = dict(ns.r, **{names[k]: {'m': 'morning', 'b': 'bedtime', 'e': 'early'}.get(v, v) if k == 'k' else v}) %}
        {% endfor %}
        {{ {'fetch': j.f | default(0), 'arrival': j.a | default(0), 'routine': ns.r, 'learn': j.l | default({})} }}
      state: >-
        {% set ns = namespace(out={}) %}
        {% for k, v in stored.items() if k != 'routine' %}{% set ns.out = dict(ns.out, **{k: v}) %}{% endfor %}
        {{ ns.out }}
      # The routine plan records intent, not temperatures: its kind (morning
      # or bedtime), start (when the morning heating starts, or bedtime began)
      # and wake (when people get up: the alarm, or the start if someone got up
      # first). Its stage is worked out from today's periods on each run, so it
      # follows a schedule group change. until, temp and applied describe the
      # Timer we last applied: when it should end and its temperature (to tell
      # whether the stage has changed), and when we pressed Apply (to tell ours
      # from someone else's). exited is when we last ended our own Timer, so
      # that Exit press is not taken for someone cancelling. A cancelled plan is
      # kept, marked, so it does not start again that day.
      plan: >-
        {% set r = stored.routine %}
        {% set start = r.start | default(0) | int %}
        {{ {'kind': r.kind | default(''), 'start': start, 'wake': r.wake | default(start) | int,
            'until': r.until | default(0) | int, 'temp': r.temp | default(none),
            'applied': r.applied | default(0) | int, 'exited': r.exited | default(0) | int,
            'cancelled': r.cancelled | default(false) | bool} }}
      # The schedule is being edited: operating day or period entities changed
      # in the last 5 minutes and after our last fetch (allowing 60 s for its
      # own changes), and not as a burst. A fetch replaces the selects, so
      # anything older is gone. A fetch time in the future (the clock went back)
      # is ignored. A restart or the thermostat rejoining changes half or more
      # of them within 30 s; a person edits them one at a time. Keep this in
      # step with the Schedule editing finished trigger.
      schedule_editing: >-
        {% set f = state.fetch | default(0) | int %}
        {% set f = f if f <= now().timestamp() else 0 %}
        {% set watched = expand([operating_day] + period_entities) %}
        {% set cut = [now().timestamp() - editing_window, f + fetch_grace] | max %}
        {% set ts = watched | map(attribute='last_changed') | map('as_timestamp') | select('gt', cut) | list %}
        {{ ts | first is defined
           and not (ts | count >= (watched | count) / 2 and ts | max - ts | min <= burst_span) }}
      # Someone is heading home and close. Keep this in step with the Someone
      # heading home trigger. Only used while the home zone is empty, so it is
      # skipped otherwise.
      heading_home: >-
        {% set ns = namespace(on=false, ents=[]) %}
        {% if away_enabled and states(home_zone) | int(0) == 0 %}
          {% for e in arriving_sensors %}{% if is_state(e, 'on') %}{% set ns.on = true %}{% endif %}{% endfor %}
          {% if proximity_devices %}
            {% for d in proximity_devices %}{% set ns.ents = ns.ents + device_entities(d) %}{% endfor %}
          {% else %}
            {% set zone_name = state_attr(home_zone, 'friendly_name') %}
            {% for e in integration_entities('proximity') %}
              {% if device_attr(e, 'name') == zone_name %}{% set ns.ents = ns.ents + [e] %}{% endif %}
            {% endfor %}
          {% endif %}
          {% for d in ns.ents | select('match', '^sensor\\..*_distance$') | reject('search', '_nearest_distance$') %}
            {% set km = states(d) | float(none) %}
            {% set to_km = {'m': 0.001, 'km': 1, 'mi': 1.609344, 'yd': 0.0009144, 'ft': 0.0003048} %}
            {% if km is not none and is_state(d[:-9] ~ '_direction_of_travel', 'towards')
                  and geofencing_distance | float(0) > 0
                  and km * to_km.get(state_attr(d, 'unit_of_measurement'), 1) <= geofencing_distance | float(0) %}
              {% set ns.on = true %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.on }}
      # Geofencing pre-heating started at this time, and is still within its
      # timeout. Turning off the away schedule ends it.
      arrival: "{{ state.arrival | default(0) | int }}"
      preheating: >-
        {{ away_enabled and arrival > 0
           and now().timestamp() < arrival + geofencing_timeout | int * 60 }}
      # The thermostat is on its schedule. A hand adjustment puts it in
      # Temporary_Manual until the next period; Manual and Off are yours too.
      # The routine applies nothing until it is back on its schedule.
      on_schedule: "{{ is_state(work_mode_state, 'Schedule') }}"
      # The alarm when it is today and still ahead, otherwise blank.
      alarm_time: >-
        {% set a = states(alarm_sensor) | as_datetime(none) %}
        {{ (a | as_local).isoformat() if a is not none and (a | as_local).date() == now().date() and now() < a else '' }}
  # Someone got home, or pre-heating timed out and nobody is heading home any
  # more, so the arrival is over. After the timeout, a new Someone heading home
  # trigger means they stopped heading home and set off again: a new trip.
  - alias: Finish a geofencing arrival
    if:
      - condition: template
        value_template: >-
          {{ arrival > 0 and (states(home_zone) | int(0) > 0
             or (not preheating and (not heading_home or run == 'heading-home'))) }}
    then:
      - variables:
          state: "{{ dict(state, arrival=0) }}"
          arrival: 0
          preheating: false
  # When the override Apply and Exit buttons were last pressed. Pressing one
  # updates its state, even when the thermostat does not answer.
  - variables:
      apply_pressed_at: "{{ as_timestamp(states(override_apply), 0) | int }}"
      exit_pressed_at: "{{ as_timestamp(states(override_exit), 0) | int }}"
  # Someone pressed Exit on our Timer (our Apply was the last one), and it was
  # not us ending it to apply the next one, so they cancelled the routine for
  # today. Taking over with your own Timer or Boost (Apply) and then ending it,
  # adjusting the thermostat by hand, or the thermostat restarting does not
  # cancel it: the routine steps aside and carries on afterwards.
  - alias: Note a cancelled plan
    if:
      - condition: template
        value_template: >-
          {{ plan.kind != '' and not plan.cancelled and plan.applied > 0
             and apply_pressed_at == plan.applied and exit_pressed_at > plan.applied
             and not (plan.exited > 0 and 0 <= exit_pressed_at - plan.exited <= exit_window) }}
    then:
      - variables:
          plan: "{{ dict(plan, cancelled=true) }}"
  - variables:
      # An empty plan, for clearing it.
      empty_plan: >-
        {{ {'kind': '', 'start': 0, 'wake': 0, 'until': 0, 'temp': none, 'applied': 0,
            'exited': 0, 'cancelled': false} }}
      # The plan is for today. One from an earlier day is over.
      plan_today: "{{ plan.start > 0 and plan.start | timestamp_custom('%Y-%m-%d') == now().strftime('%Y-%m-%d') }}"
      plan_active: "{{ plan.kind != '' and not plan.cancelled and plan_today }}"
      # The routine someone cancelled today, if any, so it does not start again.
      cancelled_today: "{{ plan.kind if plan.cancelled and plan_today else '' }}"
      # Someone's Boost or Timer (the routine's or not) is running.
      override_running: "{{ states(override_state) in ['Boost', 'Timer'] }}"
      # Our routine's Timer is running: a Timer, and the override Apply button
      # was last pressed by us. A Timer or Boost only starts from Apply, so
      # anyone else's press makes the running override theirs, and it is
      # left alone. Changing the target or period without applying does not.
      routine_timer_running: >-
        {{ plan_active and is_state(override_state, 'Timer') and plan.applied > 0
           and apply_pressed_at == plan.applied }}
  # A plan from an earlier day is over, so clear it, including yesterday's
  # cancelled marker.
  - alias: Forget a plan from an earlier day
    if:
      - condition: template
        value_template: "{{ plan.kind != '' and not plan_today }}"
    then:
      - variables:
          plan: "{{ empty_plan }}"
  # A warm-up measurement (learn.m: when it started, the room temperature then
  # and the target) ends when the thermostat goes idle (Warmed up), on the
  # first run after that. It runs before a run defers, so a deferred Warmed up
  # run still counts. The room rose to where the thermostat stops (the target
  # plus its high threshold, exact since it stops by its own reading) when the
  # room is within 0.3 degrees of it (its reading lags, and the room keeps
  # rising after the heating stops), or else to the room temperature (the
  # target dropped first). The rise and the minutes taken are added to
  # learn.s, the weighted mean and spread of recent mornings, each earlier
  # morning counting less (learning.memory). It is dropped if the room rose
  # less than learning.min_rise, took over learning.max_minutes, or was not
  # read within learning.read_within of the idle. Before the idle, it is
  # dropped if the group changed (also when the thermostat dropped off or Home Assistant
  # restarted), someone else takes over or cancels the routine (an Exit after
  # the idle leaves it), the thermostat leaves its schedule or
  # the heating stopped and started again unseen. Times are in whole seconds,
  # like m's start.
  - alias: Learn the warm-up time
    if:
      - condition: template
        value_template: "{{ (state.learn | default({})).m | default([]) | count == 3 }}"
    then:
      - variables:
          state: >-
            {% set l = state.learn %}
            {% set m = l.m %}
            {% set s = l.s | default([0, 0, 0, 0, 0]) %}
            {% set kept = {'s': s} if s[0] > 0 else {} %}
            {% set h = states[hvac_action_sensor] %}
            {% set since = h.last_changed.timestamp() if h is not none else 0 %}
            {% set warmed = h is not none and h.state == 'idle' and since > m[0] %}
            {% set end = since if warmed else now().timestamp() %}
            {% set elapsed = (end - m[0]) / 60 %}
            {% set stop = m[2] + high_threshold %}
            {% set top = stop if room_temp is not none and room_temp >= stop - learning.near_stop else room_temp %}
            {% set rose = top - m[1] if top is not none else 0 %}
            {% set g = states[schedule_group].last_changed.timestamp() | int %}
            {% set regrouped = m[0] < g <= end + learning.regroup_margin %}
            {% set cancelled = plan_today and plan.cancelled and (not warmed or exit_pressed_at <= since) %}
            {% if warmed and not regrouped and not cancelled %}
              {% if rose >= learning.min_rise and elapsed <= learning.max_minutes
                    and now().timestamp() - since <= learning.read_within %}
                {% set w = s[0] * learning.memory %}
                {% set w1 = w + 1 %}
                {% set dx = rose - s[1] %}
                {% set dy = elapsed - s[2] %}
                {% set out = {'s': [w1 | round(2), (s[1] + dx / w1) | round(2), (s[2] + dy / w1) | round(1),
                                    ((w * s[3] + w / w1 * dx * dx) / w1) | round(2),
                                    ((w * s[4] + w / w1 * dx * dy) / w1) | round(1)]} %}
              {% else %}
                {% set out = kept %}
              {% endif %}
            {% elif regrouped or cancelled or ((override_running or not on_schedule) and not routine_timer_running)
                  or elapsed > learning.max_minutes
                  or (h is not none and h.state == 'heating' and since > m[0] + learning.restart) %}
              {% set out = kept %}
            {% else %}
              {% set out = l %}
            {% endif %}
            {{ dict(state, learn=out) }}
  # The warm-up time learned so far, as learn.f: [dead time, minutes per
  # degree], once two mornings have been measured, and removed before then.
  # The rate is the line through the measured mornings (learn.s holds their
  # weight, mean rise, mean minutes, rise variance and covariance), drawn
  # towards the assumed rate until their rises spread out by a degree or two,
  # and kept within its limits. The dead time is what is left at no rise, and
  # until the rate is known it also takes up any error in the assumed one.
  # Worked out on every run, so the lead_minutes variable and the alarm
  # triggers only read it.
  - alias: Fit the warm-up time
    variables:
      state: >-
        {% set l = state.learn | default({}) %}
        {% set s = l.s | default([0, 0, 0, 0, 0]) %}
        {% set c = learning %}
        {% set rate = [[(s[0] * s[4] + c.rate * c.pull) / (s[0] * s[3] + c.pull), c.min_rate] | max, c.max_rate] | min %}
        {% set dead = [[s[2] - rate * s[1], 0] | max, c.max_dead] | min %}
        {% set ns = namespace(l={}) %}
        {% for k, v in l.items() if k != 'f' %}{% set ns.l = dict(ns.l, **{k: v}) %}{% endfor %}
        {{ dict(state, learn=dict(ns.l, f=[dead | round(2), rate | round(2)]) if s[0] >= c.min_weight else ns.l) }}
  # While the schedule is being edited its selects cannot be trusted, and a
  # fetch would replace the day being edited. The run saves its state and
  # defers, and the Schedule editing finished trigger catches up.
  - alias: Defer while the schedule is being edited
    if:
      - condition: template
        value_template: "{{ schedule_editing }}"
    then:
      # Saved with one-letter keys (see stored), and the plan without its unset
      # fields (the plan variable reads them back as their defaults), so it
      # fits the helper's maximum length. In the rare case it still does not,
      # the warm-up measurement in progress is dropped rather than the save
      # failing.
      - &save_state
        alias: Save the state
        action: input_text.set_value
        target:
          entity_id: "{{ state_helper }}"
        data:
          value: >-
            {% set short = {'kind': 'k', 'start': 's', 'wake': 'w', 'until': 'u', 'temp': 't',
                            'applied': 'p', 'exited': 'x', 'cancelled': 'c'} %}
            {% set ns = namespace(r={}, l={}) %}
            {% for k, v in plan.items() if plan.kind != '' and (v or k in ['kind', 'start']) %}
              {% set ns.r = dict(ns.r, **{short[k]: v[:1] if k == 'kind' else 1 if v is sameas true else v}) %}
            {% endfor %}
            {% set l = state.learn | default({}) %}
            {% set out = {'f': state.fetch | default(0), 'a': state.arrival | default(0), 'r': ns.r} %}
            {% set full = dict(out, l=l) if l else out %}
            {% set ns.l = {} %}
            {% for k, v in l.items() if k != 'm' %}{% set ns.l = dict(ns.l, **{k: v}) %}{% endfor %}
            {% set trimmed = dict(out, l=ns.l) if ns.l else out %}
            {{ (full if full | to_json | length <= state_attr(state_helper, 'max') | int(255) else trimmed) | to_json }}
      - stop: >-
          Deferred: the schedule is being edited in the UI. A catch-up runs 5 minutes
          after the last change.
  # The routine plan does not apply while nobody is home, so drop it and end
  # its Timer.
  - alias: Nobody home, end the routine
    if:
      - condition: template
        value_template: "{{ nobody_home }}"
    then:
      - variables:
          plan: "{{ empty_plan }}"
          plan_active: false
      - *save_state
      - if:
          - condition: template
            value_template: "{{ routine_timer_running }}"
        then:
          - alias: End our Timer
            action: button.press
            target:
              entity_id: "{{ override_exit }}"
          - variables:
              routine_timer_running: false
              override_running: false
  # Each branch below picks the group, and it is only written when it
  # differs, saving a Zigbee write on most runs.
  - alias: Note the schedule group before switching
    variables:
      group_before: "{{ states(schedule_group) }}"
      group_target: ""
  - choose:
      - alias: Nobody home but someone heading home, pre-heat
        conditions:
          - alias: Nobody home
            condition: template
            value_template: "{{ nobody_home }}"
          - alias: Heading home now, or pre-heating within its timeout
            condition: template
            value_template: "{{ preheating or (arrival == 0 and heading_home) }}"
        sequence:
          - variables:
              state: "{{ dict(state, arrival=arrival if arrival > 0 else now().timestamp() | int) }}"
          - *save_state
          - variables:
              group_target: !input geofencing_group
      - alias: Nobody home, end override and set Schedule 3
        conditions:
          - alias: Nobody home
            condition: template
            value_template: "{{ nobody_home }}"
          - alias: Away schedule on
            condition: template
            value_template: "{{ away_enabled }}"
        sequence:
          # Only on switching to Schedule 3, so a Boost started while away is
          # left alone.
          - if:
              - condition: template
                value_template: "{{ override_running and group_before != 'Schedule 3' }}"
            then:
              - alias: End the override
                action: button.press
                target:
                  entity_id: "{{ override_exit }}"
          - variables:
              group_target: Schedule 3
      # After the nobody-home branches, so Schedule 1 only applies to an empty
      # house when follow occupancy and the away schedule are off.
      - alias: Heated areas occupied (or follow occupancy off), Schedule 1
        conditions:
          - condition: or
            conditions:
              - condition: template
                value_template: "{{ not following_occupancy }}"
              - condition: occupancy.is_detected
                target:
                  area_id: !input heated_areas
                options:
                  behavior: any
                  for: !input occupied_delay
          - alias: No override running, or only our routine's Timer
            condition: template
            value_template: "{{ not override_running or routine_timer_running }}"
        sequence:
          - variables:
              group_target: Schedule 1
      - alias: Heated areas clear, Schedule 2
        conditions:
          - condition: template
            value_template: "{{ following_occupancy }}"
          - condition: occupancy.is_not_detected
            target:
              area_id: !input heated_areas
            options:
              behavior: all
              for: !input empty_delay
          - alias: No override running, or only our routine's Timer
            condition: template
            value_template: "{{ not override_running or routine_timer_running }}"
        sequence:
          - variables:
              group_target: Schedule 2
  - alias: Switch the schedule group
    if:
      - condition: template
        value_template: "{{ group_target != '' and group_target != group_before }}"
    then:
      - action: select.select_option
        target:
          entity_id: "{{ schedule_group }}"
        data:
          option: "{{ group_target }}"
  - variables:
      # Each group has its own periods. A group change made by this run plans
      # the routine again when it matters: a plan is running, a morning start
      # may be due (today's alarm still ahead, or someone up), or early start
      # is on, as the new group may have a warmer period coming up.
      group_changed: "{{ states(schedule_group) != group_before }}"
      morning_ahead: "{{ alarm_time != '' or awake_sensors | select('is_state', 'on') | first is defined }}"
      catch_up: "{{ run == 'catch-up' or (group_changed and (plan_active or morning_ahead or early_start_enabled)) }}"
  # Runs that can start, continue or end a routine plan it. An override-ended
  # run carries on only while still Idle: replacing our own Timer passes
  # through Idle, and the run that queues needs nothing. Getting up and
  # bedtime runs only matter while their feature is on.
  - alias: Plan the routine
    if:
      - condition: template
        value_template: >-
          {{ catch_up or run in ['early-alarm', 'late-alarm', 'new-day', 'period-2', 'early-start']
             or (run == 'getting-up' and (getting_up_enabled or (plan_active and plan.kind == 'bedtime')))
             or (run == 'bedtime' and bedtime_enabled)
             or (plan_active and run == 'override-ended' and is_state(override_state, 'Idle')) }}
    then:
      # The selects show the last fetched schedule. It is out of date when no
      # fetch is recorded, they show another day, the group changed after the
      # fetch, a schedule entity changed after it (an edit, a restart or the
      # thermostat rejoining), or a period cannot be read. The fetch is recorded
      # in whole seconds, so the group is too: a run that switches the group
      # and then fetches within the same second fetched the new group.
      - variables:
          schedule_stale: >-
            {% set f = state.fetch | default(0) | int %}
            {% set f = f if f <= now().timestamp() else 0 %}
            {% set ents = expand([operating_day] + period_entities) %}
            {{ f == 0 or states(operating_day) != now().strftime('%A')
               or states[schedule_group].last_changed.timestamp() | int > f
               or ents | selectattr('state', 'in', ['unavailable', 'unknown']) | first is defined
               or ents | map(attribute='last_changed') | map('as_timestamp')
                  | select('gt', f + fetch_grace) | first is defined }}
      # Fetch today's schedule for the active group when the selects are out of
      # date. The start time is recorded first, so its changes are not taken
      # for an edit. If the fetch fails the run stops rather than act on a
      # schedule it could not read.
      - alias: Fetch today's schedule
        if:
          - condition: template
            value_template: "{{ schedule_stale }}"
        then:
          - variables:
              state: "{{ dict(state, fetch=now().timestamp() | int) }}"
          - *save_state
          - alias: Select today as the operating day
            action: select.select_option
            target:
              entity_id: "{{ operating_day }}"
            data:
              option: "{{ now().strftime('%A') }}"
          # The press returns once the device has replied, so no wait is needed.
          - alias: Fetch the active schedule
            action: button.press
            target:
              entity_id: "{{ fetch_button }}"
      - alias: Read the schedule and the alarm
        variables:
          # Periods in order as {time, temp}, stopping at the first unset (NULL)
          # time. Period 1 is fixed at 00:00. A missing temperature is none.
          periods: >-
            {% set ns = namespace(out=[], open=true) %}
            {% for i in range(1, 13) %}
              {% set t = period_entities | select('search', '_schedule_period_' ~ i ~ '_time$') | first | default('') %}
              {% set p = period_entities | select('search', '_schedule_period_' ~ i ~ '_temp$') | first | default('') %}
              {% set s = states(t) if t != '' else '' %}
              {% if ns.open and s is match('^[0-9]{2}:[0-9]{2}') %}
                {% set ns.out = ns.out + [{'time': s[:5], 'temp': states(p) | float(none)}] %}
              {% else %}
                {% set ns.open = false %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
          # With 4 or more periods and a period 2 of at most 3 hours, period 2 is
          # the morning and period 3 daytime heating, so the morning shifts with
          # the alarm. Otherwise period 3 (if any) is another part of the day,
          # such as the evening, so period 2 is only started early or period 1
          # held late, and later periods keep their usual times.
          morning_shifts: >-
            {{ periods | count >= 4
               and 0 < (today_at(periods[2].time) - today_at(periods[1].time)).total_seconds() <= morning_max }}
          # Period 2 is set and warmer than period 1 (and period 3 is set, if the
          # morning shifts), so starting it early or late changes something.
          p2_warmer: >-
            {{ periods | count >= 2
               and periods[0].temp is not none and periods[1].temp is not none
               and periods[1].temp > periods[0].temp
               and (not morning_shifts or periods[2].temp is not none) }}
          # An awake sensor has been on for the getting up delay, as its trigger
          # requires.
          someone_up: >-
            {{ expand(awake_sensors) | selectattr('state', 'eq', 'on')
               | selectattr('last_changed', 'le', now() - timedelta(seconds=delay_secs['getting_up']))
               | first is defined }}
          # Someone is up, and getting up is turned on. Its trigger only fires when
          # an awake sensor turns on, so catch-up and late start runs also count
          # one that is already on.
          getting_up: >-
            {{ getting_up_enabled and (run == 'getting-up' or ((catch_up or run == 'late-alarm') and someone_up)) }}
          # Everyone has been asleep long enough (every awake sensor off
          # for at least the bedtime delay).
          everyone_asleep: >-
            {% set sensors = expand(awake_sensors) %}
            {{ sensors | first is defined
               and sensors | rejectattr('state', 'eq', 'off') | first is not defined
               and sensors | selectattr('last_changed', 'gt', now() - timedelta(seconds=delay_secs['bedtime'])) | first is not defined }}
          # The evening setback, while in the period just before it: the last
          # period with 3 or more periods, or period 1 again at midnight with 2.
          # Blank time otherwise, so bedtime never reaches into the next day.
          setback: >-
            {% if periods | count >= 3 and today_at(periods[-2].time) <= now() < today_at(periods[-1].time) %}
            {{ {'temp': periods[-1].temp, 'until': today_at(periods[-1].time).isoformat()} }}
            {% elif periods | count == 2 and today_at(periods[1].time) <= now() %}
            {{ {'temp': periods[0].temp, 'until': (today_at('00:00') + timedelta(days=1)).isoformat()} }}
            {% else %}{{ {'temp': none, 'until': ''} }}{% endif %}
          # The temperature of the period running now.
          current_temp: >-
            {% set ns = namespace(t=none) %}
            {% for p in periods %}{% if today_at(p.time) <= now() %}{% set ns.t = p.temp %}{% endif %}{% endfor %}
            {{ ns.t }}
          # Minutes before the alarm to start, once the warm-up has been learned
          # (learn.f, see Fit the warm-up time): the dead time plus the minutes
          # per degree times the rise from the room temperature now to where the
          # thermostat stops (period 2's temperature plus its high threshold),
          # kept within 10 and 180. Until then 5 minutes, so the morning starts
          # at the alarm: just before it, as the alarm sensor moves on to the
          # next alarm as it rings, and a run queued behind others still starts
          # it in time. Keep this in step with the alarm triggers.
          lead_minutes: >-
            {% set f = (state.learn | default({})).f | default([]) %}
            {% set p2t = periods[1].temp if periods | count >= 2 else none %}
            {{ ([[f[0] + f[1] * (p2t + high_threshold - room_temp), 10] | max, 180] | min) | int
               if f | count == 2 and room_temp is not none and p2t is not none else 5 }}
          # The alarm minus the lead, when that is today too. Otherwise blank.
          alarm_start: >-
            {% if alarm_time == '' %}{{ '' }}{% else %}
            {% set start = (alarm_time | as_datetime) - timedelta(minutes=lead_minutes) %}
            {{ start.isoformat() if start.date() == now().date() else '' }}
            {% endif %}
          # The routine start and wake: now for both if someone is up before the
          # alarm start (or with no alarm), otherwise the alarm start and the
          # alarm.
          routine_now: "{{ getting_up and (alarm_start == '' or now() < alarm_start | as_datetime) }}"
          routine_start: "{{ now().isoformat() if routine_now else alarm_start }}"
          routine_wake: "{{ now().isoformat() if routine_now else alarm_time }}"
          # An early start is due: the alarm start has been reached (early alarm
          # on) or someone is up, the start is at or before period 2, and the
          # morning has at least a minute left (see the routine's stage below).
          early_start_due: >-
            {% if (((run == 'early-alarm' or catch_up) and early_alarm_enabled) or getting_up)
                  and routine_start != '' and periods | count >= 2 %}
              {% set s = (routine_start | as_datetime).timestamp() %}
              {% set w = (routine_wake | as_datetime).timestamp() %}
              {% set p2 = today_at(periods[1].time).timestamp() %}
              {% if morning_shifts %}
                {% set p3 = today_at(periods[2].time).timestamp() %}
                {% set end = [[w + (p3 - p2), today_at(periods[3].time).timestamp()] | min, p3] | max %}
              {% else %}
                {% set end = p2 %}
              {% endif %}
              {{ s <= now().timestamp() and s <= p2 and end - now().timestamp() >= min_stage }}
            {% else %}{{ false }}{% endif %}
          # A late start is due: nobody is up, period 2 is about to start (or has),
          # and the routine start is at least a minute after it.
          late_start_due: >-
            {% if late_alarm_enabled and (run == 'late-alarm' or catch_up) and not getting_up
                  and routine_start != '' and periods | count >= 2 %}
              {% set start = routine_start | as_datetime %}
              {% set p2 = today_at(periods[1].time) %}
              {{ p2 < start and now() >= p2 - timedelta(minutes=1) and (start - now()).total_seconds() >= min_stage }}
            {% else %}{{ false }}{% endif %}
          # The routine has warmed the room for a morning today: a morning plan,
          # or an early start for period 2, now or saved before this run (one
          # that was cancelled too). A plan is cleared once it ends, so an ended
          # one no longer counts. That is fine: by then a measurement still in
          # progress, or the room already being warm, stops a second one, and
          # the period 2 early start window has closed.
          routine_morning_today: >-
            {% set r = stored.routine %}
            {% set rs = r.start | default(0) | int %}
            {% set p2 = today_at(periods[1].time).timestamp() | int if periods | count >= 2 else -1 %}
            {{ plan.kind == 'morning' or (plan.kind == 'early' and plan.wake == p2)
               or ((r.kind | default('') == 'morning' or (r.kind | default('') == 'early' and r.wake | default(0) == p2))
                   and rs > 0 and rs | timestamp_custom('%Y-%m-%d') == now().strftime('%Y-%m-%d')) }}
          # The period an early start is due for, as {n, at, temp}: the first
          # period warmer than the one before whose window is open, from the
          # learned lead before it (to where the thermostat stops, as for the
          # alarm) until a minute before it, while the room is
          # cool enough for the thermostat to heat for it (below its temperature
          # plus the low threshold). None without a learned lead or with early
          # start off. Keep this in step with the Early start window opened
          # trigger.
          early_period: >-
            {% set f = (state.learn | default({})).f | default([]) %}
            {% set ns = namespace(out=none) %}
            {% if early_start_enabled and f | count == 2 and room_temp is not none %}
              {% for i in range(1, periods | count) %}
                {% set p = periods[i] %}
                {% set q = periods[i - 1] %}
                {% set at = today_at(p.time).timestamp() | int %}
                {% if ns.out is none and p.temp is not none and q.temp is not none and p.temp > q.temp
                      and room_temp < p.temp + low_threshold %}
                  {% set lead = [[f[0] + f[1] * (p.temp + high_threshold - room_temp), 10] | max, 180] | min %}
                  {% if at - lead * 60 <= now().timestamp() <= at - min_stage %}
                    {% set ns.out = {'n': i + 1, 'at': at, 'temp': p.temp} %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {{ ns.out }}
        # An unreadable schedule (unavailable selects) leaves everything as
        # it is.
      - alias: With a readable schedule
        if:
          - condition: template
            value_template: "{{ periods | first is defined }}"
        then:
          - alias: Someone got up during bedtime, end it
            if:
              - condition: template
                value_template: >-
                  {{ plan_active and plan.kind == 'bedtime' and run in ['getting-up', 'catch-up'] and someone_up }}
            then:
              - variables:
                  plan: "{{ empty_plan }}"
                  plan_active: false
          # Bedtime starts and ends only on its own runs or a catch-up, not on a
          # group change.
          - alias: Update the plan
            choose:
              - alias: Someone got up during a late hold, start the morning now
                conditions:
                  - condition: template
                    value_template: "{{ getting_up and plan_active and plan.kind == 'morning' and now().timestamp() < plan.start }}"
                  - alias: Someone is home
                    condition: template
                    value_template: "{{ not nobody_home }}"
                sequence:
                  - variables:
                      plan: "{{ dict(plan, start=now().timestamp() | int, wake=now().timestamp() | int) }}"
              # The heating has already started, so the morning keeps the early
              # start's start and takes its wake from now.
              - alias: Someone got up during an early start for period 2, start the morning now
                conditions:
                  - condition: template
                    value_template: >-
                      {{ getting_up and plan_active and plan.kind == 'early' and periods | count >= 2
                         and plan.wake == today_at(periods[1].time).timestamp() | int and now().timestamp() < plan.wake }}
                  - alias: Someone is home
                    condition: template
                    value_template: "{{ not nobody_home }}"
                sequence:
                  - variables:
                      plan: "{{ dict(plan, kind='morning', wake=now().timestamp() | int) }}"
              - alias: Everyone asleep, start bedtime
                conditions:
                  - alias: Everyone has been asleep long enough
                    condition: template
                    value_template: "{{ bedtime_enabled and not plan_active and run in ['bedtime', 'catch-up'] and everyone_asleep }}"
                  - alias: The setback is at least a minute away and cooler than now
                    condition: template
                    value_template: >-
                      {{ setback.until != '' and setback.temp is not none and current_temp is not none
                         and current_temp > setback.temp
                         and ((setback.until | as_datetime) - now()).total_seconds() >= min_stage }}
                  - alias: No override running
                    condition: template
                    value_template: "{{ not override_running }}"
                  - alias: Not cancelled today
                    condition: template
                    value_template: "{{ cancelled_today != 'bedtime' }}"
                  - alias: Someone is home
                    condition: template
                    value_template: "{{ not nobody_home }}"
                sequence:
                  - variables:
                      plan: "{{ dict(empty_plan, kind='bedtime', start=now().timestamp() | int) }}"
                      plan_active: true
              # Early: the morning starts at the routine start, before period 2.
              # Late: period 1 is held until the routine start, after period 2.
              - alias: Early or late alarm, or someone up, start the morning
                conditions:
                  - alias: An early or late start is due
                    condition: template
                    value_template: "{{ not plan_active and (early_start_due or late_start_due) }}"
                  - alias: Period 2 is set and warmer than period 1
                    condition: template
                    value_template: "{{ p2_warmer }}"
                  - alias: No override running
                    condition: template
                    value_template: "{{ not override_running }}"
                  - alias: Someone is home
                    condition: template
                    value_template: "{{ not nobody_home }}"
                  - alias: Not cancelled today
                    condition: template
                    value_template: "{{ cancelled_today != 'morning' }}"
                sequence:
                  - variables:
                      plan: >-
                        {{ dict(empty_plan, kind='morning', start=(routine_start | as_datetime).timestamp() | int,
                                wake=(routine_wake | as_datetime).timestamp() | int) }}
                      plan_active: true
              # Early start: a period warmer than the one before starts now, so
              # the room is warm when it begins. Period 2 is left to the alarm
              # and getting up when either is involved today. wake is the
              # period's usual start.
              - alias: Early start for a warmer period
                conditions:
                  - alias: An early start is due
                    condition: template
                    value_template: >-
                      {{ not plan_active and early_period is not none and (catch_up or run == 'early-start')
                         and not (early_period.n == 2 and (alarm_time != '' or routine_morning_today))
                         and not (plan.kind == 'early' and plan.cancelled and plan.wake == early_period.at) }}
                  - alias: No override running
                    condition: template
                    value_template: "{{ not override_running }}"
                  - alias: Someone is home
                    condition: template
                    value_template: "{{ not nobody_home }}"
                sequence:
                  - variables:
                      plan: "{{ dict(empty_plan, kind='early', start=now().timestamp() | int, wake=early_period.at) }}"
                      plan_active: true
          - alias: Work out the routine's stage
            variables:
              # The target of a morning warm-up starting this run, set below
              # when the routine applies period 2 at its start. Measured at the
              # end.
              warm_up_target: "{{ none }}"
              # What our Timer should be now, as {temp, until}, or none when the
              # schedule should carry on. The routine's phases, in order (when the
              # morning shifts, D2 is period 2's usual length). The start decides
              # whether the morning is early or late. Period 2's length counts
              # from the wake, so the room is warm when people get up and stays
              # warm as long as usual:
              #   Starting at or before period 2: when the morning shifts, period
              #   2 until the wake plus D2 (never past period 4), then period 3
              #   until its usual start. Otherwise period 2 until its usual
              #   start.
              #   Starting after period 2: period 1 until the start. Then, when
              #   the morning shifts, period 2 until the wake plus D2, never past
              #   period 4.
              #   Bedtime: the setback until its usual start.
              #   Early start: the period starting at wake, at its temperature,
              #   until its usual start. None if no period starts then (the
              #   group changed).
              # The stage is the first phase with at least a minute left, the
              # shortest override period. A Timer rounded to whole minutes can end a
              # little early, and this moves on to the next phase rather than ending.
              stage: >-
                {% set t = now().timestamp() %}
                {% set ns = namespace(ph=[]) %}
                {% if plan_active and plan.kind == 'morning' and periods | count >= 2 %}
                  {% set s = plan.start %}
                  {% set w = plan.wake %}
                  {% set p2 = today_at(periods[1].time).timestamp() %}
                  {% if s <= p2 and morning_shifts %}
                    {% set p3 = today_at(periods[2].time).timestamp() %}
                    {% set e = [w + (p3 - p2), today_at(periods[3].time).timestamp()] | min %}
                    {% set ns.ph = [{'temp': periods[1].temp, 'until': e}, {'temp': periods[2].temp, 'until': p3}] %}
                  {% elif s <= p2 %}
                    {% set ns.ph = [{'temp': periods[1].temp, 'until': p2}] %}
                  {% elif morning_shifts %}
                    {% set e = [w + (today_at(periods[2].time).timestamp() - p2), today_at(periods[3].time).timestamp()] | min %}
                    {% set ns.ph = [{'temp': periods[0].temp, 'until': s}, {'temp': periods[1].temp, 'until': e}] %}
                  {% else %}
                    {% set ns.ph = [{'temp': periods[0].temp, 'until': s}] %}
                  {% endif %}
                {% elif plan_active and plan.kind == 'bedtime' and setback.until != '' %}
                  {% set ns.ph = [{'temp': setback.temp, 'until': (setback.until | as_datetime).timestamp()}] %}
                {% elif plan_active and plan.kind == 'early' %}
                  {% for p in periods if today_at(p.time).timestamp() | int == plan.wake %}
                    {% set ns.ph = [{'temp': p.temp, 'until': plan.wake}] %}
                  {% endfor %}
                {% endif %}
                {% set o = ns.ph | selectattr('until', 'ge', t + min_stage) | first | default(none) %}
                {{ {'temp': o.temp, 'until': o.until | int} if o is not none and o.temp is not none else none }}
          # The routine has finished: the plan has no stage left, or it was
          # cleared this run (someone got up during bedtime) while our Timer
          # runs. Its Timer is ended and the plan dropped.
          - variables:
              routine_over: "{{ stage is none and not plan.cancelled and (plan.kind != '' or routine_timer_running) }}"
          # Save the plan (dropped if the routine is over) before any thermostat
          # call, so a run that fails part way leaves it for the next run.
          - variables:
              plan: "{{ empty_plan if routine_over else plan }}"
          - *save_state
          - alias: Apply the routine's stage
            choose:
              - alias: The routine is over, end our Timer
                conditions:
                  - condition: template
                    value_template: "{{ routine_over }}"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ routine_timer_running }}"
                    then:
                      - alias: End our Timer
                        action: button.press
                        target:
                          entity_id: "{{ override_exit }}"
              # Start the stage when no override is running, or replace our Timer
              # when the stage has changed (a new phase, a group change or a new
              # start). Someone else's Boost or Timer is left alone.
              - alias: Start the stage as a Timer override
                conditions:
                  - condition: template
                    value_template: >-
                      {{ stage is not none and on_schedule and (is_state(override_state, 'Idle')
                         or (routine_timer_running and ((stage.until - plan.until) | abs > 90
                                       or (plan.temp | float(0) - stage.temp) | abs > 0.05))) }}
                sequence:
                  - variables:
                      minutes: "{{ [((stage.until - now().timestamp()) / 60) | round(0) | int, 1439] | min }}"
                      timer_until: "{{ (now().timestamp() + minutes * 60) | int }}"
                  # Record that we are ending our own Timer before pressing Exit,
                  # so the press is not taken for someone cancelling.
                  - alias: End our Timer first
                    if:
                      - condition: template
                        value_template: "{{ routine_timer_running }}"
                    then:
                      - variables:
                          plan: "{{ dict(plan, exited=now().timestamp() | int) }}"
                      - *save_state
                      - action: button.press
                        target:
                          entity_id: "{{ override_exit }}"
                      - wait_template: "{{ is_state(override_state, 'Idle') }}"
                        timeout: "00:00:30"
                        continue_on_timeout: true
                  # If our Timer did not end, leave it for the next run rather than
                  # apply over it.
                  - alias: Start the new Timer
                    if:
                      - condition: template
                        value_template: "{{ is_state(override_state, 'Idle') }}"
                    then:
                      - alias: Set override mode to Timer
                        action: select.select_option
                        target:
                          entity_id: "{{ override_mode }}"
                        data:
                          option: Timer
                      - alias: Set the stage temperature
                        action: number.set_value
                        target:
                          entity_id: "{{ override_target }}"
                        data:
                          value: "{{ stage.temp }}"
                      - alias: Set the stage length
                        action: number.set_value
                        target:
                          entity_id: "{{ override_period }}"
                        data:
                          value: "{{ minutes }}"
                      - alias: Apply override
                        action: button.press
                        target:
                          entity_id: "{{ override_apply }}"
                      # Record the Timer straight after our press: when it should
                      # end, its temperature and our Apply press, so a Timer the
                      # thermostat reports late is still the routine's. Saved at the end.
                      - variables:
                          plan: >-
                            {{ dict(plan, until=timer_until, temp=stage.temp,
                                    applied=as_timestamp(states(override_apply), 0) | int) }}
                      # The morning's warm-up starts now: period 2's temperature,
                      # within learning.start_window of the start.
                      - if:
                          - condition: template
                            value_template: >-
                              {{ (plan.kind == 'morning' or (plan.kind == 'early' and plan.wake == today_at(periods[1].time).timestamp() | int))
                                 and stage.temp == periods[1].temp
                                 and (now().timestamp() - plan.start) | abs <= learning.start_window }}
                        then:
                          - variables:
                              warm_up_target: "{{ stage.temp }}"
                      - wait_template: "{{ is_state(override_state, 'Timer') }}"
                        timeout: "00:00:30"
                        continue_on_timeout: true
          # Or the thermostat's own period 2 starts a morning, within
          # learning.start_window, from the same overnight cool-down as the
          # routine's. Only with someone home, on the schedule with no override,
          # and the routine not having warmed the room for a morning today.
          - variables:
              warm_up_target: >-
                {% set p2 = today_at(periods[1].time).timestamp() if periods | count >= 2 else 0 %}
                {{ warm_up_target if warm_up_target is not none
                   else periods[1].temp if run == 'period-2' and p2 > 0 and 0 <= now().timestamp() - p2 <= learning.start_window
                     and not routine_morning_today and not nobody_home and on_schedule and not override_running
                   else none }}
          # Measure the morning's warm-up if the room is cool enough for the
          # thermostat to start heating (below the target plus its low
          # threshold), has at least learning.min_rise to rise to where it stops, and
          # no measurement is running. Saved at the end.
          - alias: Start measuring the warm-up
            if:
              - condition: template
                value_template: >-
                  {{ warm_up_target is not none and room_temp is not none
                     and room_temp < warm_up_target + low_threshold
                     and warm_up_target + high_threshold - room_temp >= learning.min_rise
                     and (state.learn | default({})).m is not defined }}
            then:
              - variables:
                  state: >-
                    {{ dict(state, learn=dict(state.learn | default({}),
                            m=[now().timestamp() | int, room_temp | round(1), warm_up_target])) }}
  - *save_state
