blueprint:
  name: Sonoff TP-WGZBA smart schedule
  description: >-
    Switches a thermostat's active schedule group by occupancy (1 heated areas
    occupied, 2 heated areas empty, 3 nobody home). Before the next waking alarm it
    starts the device's morning heating early, using the times and temperatures
    of today's on-device schedule.
  domain: automation
  source_url: https://raw.githubusercontent.com/jeverley/home-assistant-blueprints/main/blueprints/automation/sonoff_tp_wgzba_smart_schedule.yaml
  homeassistant:
    min_version: 2026.10.0
  input:
    thermostat:
      name: Thermostat
      icon: mdi:thermostat
      collapsed: false
      input:
        thermostat_device:
          name: Thermostat device
          description: A Sonoff TP-WGZBA on ZHA, with the custom quirk installed.
          selector:
            device:
              filter:
                - integration: zha
                  manufacturer: SONOFF
                  model: TP-WGZBA
    occupancy:
      name: Occupancy
      icon: mdi:home-account
      description: >-
        Switches the thermostat to Schedule 1 while the heated areas are
        occupied, Schedule 2 when they are empty, and Schedule 3 when nobody
        is home.
      collapsed: false
      input:
        heated_areas:
          name: Heated areas
          description: Areas this thermostat heats.
          selector:
            area:
              multiple: true
        home_areas:
          name: Home areas
          description: Every area that counts as someone being home.
          selector:
            area:
              multiple: true
        home_zone:
          name: Home zone
          default: zone.home
          selector:
            entity:
              filter:
                - domain: zone
        detect_delay:
          name: Occupied delay
          default:
            hours: 0
            minutes: 1
            seconds: 0
          selector:
            duration: {}
        clear_delay:
          name: Empty delay
          default:
            hours: 0
            minutes: 5
            seconds: 0
          selector:
            duration: {}
    prewarm:
      name: Early morning heating
      icon: mdi:alarm
      description: >-
        Before the next waking alarm, starts the morning heating on the
        thermostat's schedule early, at the schedule's own temperatures. Only
        runs while someone is in the home areas.
      collapsed: false
      input:
        alarm_sensor:
          name: Next waking alarm sensor
          selector:
            entity:
              filter:
                - domain: sensor
        prewarm_lead:
          name: Lead time (minutes before alarm)
          default: 30
          selector:
            number:
              min: 5
              max: 120
              step: 5
              unit_of_measurement: min
              mode: box

mode: queued
max: 10
max_exceeded: silent

trigger_variables:
  thermostat_device: !input thermostat_device
  alarm_sensor: !input alarm_sensor
  prewarm_lead: !input prewarm_lead

variables:
  # Entities created by the quirk, matched on the device by domain and
  # default entity ID ending.
  thermostat_entities: "{{ device_entities(thermostat_device) }}"
  schedule_group: >-
    {{ thermostat_entities | select('match', '^select\\..*_schedule_group$') | first | default('') }}
  operating_day: >-
    {{ thermostat_entities | select('match', '^select\\..*_schedule_operating_day$') | first | default('') }}
  fetch_button: >-
    {{ thermostat_entities | select('match', '^button\\..*_schedule_fetch$') | first | default('') }}
  override_mode: >-
    {{ thermostat_entities | select('match', '^select\\..*_override_mode$') | first | default('') }}
  override_target: >-
    {{ thermostat_entities | select('match', '^number\\..*_override_target_temperature$') | first | default('') }}
  override_period: >-
    {{ thermostat_entities | select('match', '^number\\..*_override_period$') | first | default('') }}
  override_apply: >-
    {{ thermostat_entities | select('match', '^button\\..*_override_apply$') | first | default('') }}
  override_exit: >-
    {{ thermostat_entities | select('match', '^button\\..*_override_exit$') | first | default('') }}
  override_state: >-
    {{ thermostat_entities | select('match', '^sensor\\..*_override_mode$') | first | default('') }}
  alarm_sensor: !input alarm_sensor
  prewarm_lead: !input prewarm_lead
  heated_areas: !input heated_areas
  home_areas: !input home_areas

triggers:
  - alias: Heated areas occupied
    trigger: occupancy.detected
    target:
      area_id: !input heated_areas
    options:
      behavior: first
      for: !input detect_delay
  - alias: Heated areas empty
    trigger: occupancy.cleared
    target:
      area_id: !input heated_areas
    options:
      behavior: all
      for: !input clear_delay
  - alias: Home areas empty
    trigger: occupancy.cleared
    target:
      area_id: !input home_areas
    options:
      behavior: all
      for: !input clear_delay
  - alias: Home zone occupied
    trigger: zone.occupancy_detected
    options:
      for: "00:00:00"
      zone: !input home_zone
  - alias: Home zone empty
    trigger: zone.occupancy_cleared
    options:
      for: "00:00:00"
      zone: !input home_zone
  - alias: Schedule group came back
    trigger: template
    value_template: >-
      {% set e = device_entities(thermostat_device)
           | select('match', '^select\\..*_schedule_group$') | first | default('') %}
      {{ e != '' and states(e) not in ['unavailable', 'unknown'] }}
  - alias: Early heating window opened
    trigger: template
    id: prewarm
    value_template: >-
      {% set a = states(alarm_sensor) | as_datetime(none) %}
      {{ a is not none and a - timedelta(minutes=prewarm_lead | int) <= now() < a }}
  # The window may already be open when Home Assistant starts or automations
  # reload, so the template trigger above would not fire. Check it again then.
  - alias: Home Assistant started
    trigger: homeassistant
    id: prewarm
    event: start
  - alias: Automations reloaded
    trigger: event
    id: prewarm
    event_type: automation_reloaded
  - alias: Timer override ended
    trigger: template
    id: override-ended
    value_template: >-
      {% set e = device_entities(thermostat_device)
           | select('match', '^sensor\\..*_override_mode$') | first | default('') %}
      {{ e != '' and is_state(e, 'Idle') }}

conditions: []

actions:
  - alias: Stop if the device is missing an entity
    if:
      - condition: template
        value_template: >-
          {{ '' in [schedule_group, operating_day, fetch_button, override_mode,
                    override_target, override_period, override_apply,
                    override_exit, override_state] }}
    then:
      - stop: >-
          Could not find every quirk entity on the thermostat device. Check the
          entity IDs still end with their default names.
        error: true
  - alias: Stop if no heated or home areas are set
    if:
      - condition: template
        value_template: "{{ heated_areas | count == 0 or home_areas | count == 0 }}"
    then:
      - stop: Set at least one heated area and one home area.
        error: true
  - variables:
      # Inside the early heating window, with the window and alarm on the same day.
      in_window: >-
        {% set a = states(alarm_sensor) | as_datetime(none) %}
        {% if a is none %}false{% else %}
        {% set a = a | as_local %}
        {% set start = a - timedelta(minutes=prewarm_lead | int) %}
        {{ start <= now() < a and start.date() == a.date() }}
        {% endif %}
      # The template trigger fires on any change to Idle; only Timer counts.
      timer_ended: >-
        {{ trigger.id == 'override-ended' and trigger.from_state is not none
           and trigger.from_state.state == 'Timer' }}
  - alias: Fetch today's schedule
    if:
      - condition: template
        value_template: "{{ (trigger.id == 'prewarm' and in_window) or timer_ended }}"
    then:
      - alias: Select today as the operating day
        action: select.select_option
        target:
          entity_id: "{{ operating_day }}"
        data:
          option: "{{ now().strftime('%A') }}"
      # The press returns once the device has replied, so no wait is needed.
      - alias: Fetch the active schedule
        action: button.press
        target:
          entity_id: "{{ fetch_button }}"
      - alias: Read the configured periods
        variables:
          # Periods in order as {time, temp}, stopping at the first unset (NULL)
          # time. Period 1 is fixed at 00:00. A missing temperature is none.
          periods: >-
            {% set ns = namespace(out=[], open=true) %}
            {% for i in range(1, 13) %}
              {% set t = thermostat_entities
                   | select('match', '^select\\..*_schedule_period_' ~ i ~ '_time$')
                   | first | default('') %}
              {% set p = thermostat_entities
                   | select('match', '^number\\..*_schedule_period_' ~ i ~ '_temp$')
                   | first | default('') %}
              {% set s = states(t) if t != '' else '' %}
              {% if ns.open and s is match('^[0-9]{2}:[0-9]{2}') %}
                {% set ns.out = ns.out + [{'time': s[:5], 'temp': states(p) | float(none)}] %}
              {% else %}
                {% set ns.open = false %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
          # With 4 or more periods, period 3 is daytime heating, so the morning
          # is shifted earlier. With 2 or 3, period 3 (if any) is the evening
          # setback, so period 2 is only started early.
          shift: "{{ periods | count >= 4 }}"
  - choose:
      - alias: Start period 2 early
        conditions:
          - condition: template
            value_template: "{{ trigger.id == 'prewarm' and in_window }}"
          - alias: Period 2 is set and warmer than period 1
            condition: template
            value_template: >-
              {{ periods | count >= 2
                 and periods[0].temp is not none and periods[1].temp is not none
                 and periods[1].temp > periods[0].temp
                 and (not shift or periods[2].temp is not none) }}
          - alias: At least a minute before period 2
            condition: template
            value_template: >-
              {{ (today_at(periods[1].time) - now()).total_seconds() >= 60 }}
          - alias: No override already running
            condition: template
            value_template: "{{ states(override_state) not in ['Boost', 'Timer'] }}"
          - alias: Someone is in the house
            condition: occupancy.is_detected
            target:
              area_id: !input home_areas
            options:
              behavior: any
              for: "00:00:00"
        sequence:
          - variables:
              # Shift: run period 2 for its usual length from the window start.
              # Otherwise: run period 2 until its usual start.
              stage_1_minutes: >-
                {% set a = states(alarm_sensor) | as_datetime | as_local %}
                {% set start = a - timedelta(minutes=prewarm_lead | int) %}
                {% set p2 = today_at(periods[1].time) %}
                {% set end = start + (today_at(periods[2].time) - p2) if shift else p2 %}
                {{ min(((end - now()).total_seconds() / 60) | round(0) | int, 1439) }}
          - alias: Stop if the early period would be under a minute
            condition: template
            value_template: "{{ stage_1_minutes >= 1 }}"
          - alias: Set override mode to Timer
            action: select.select_option
            target:
              entity_id: "{{ override_mode }}"
            data:
              option: Timer
          - alias: Set period 2 temperature
            action: number.set_value
            target:
              entity_id: "{{ override_target }}"
            data:
              value: "{{ periods[1].temp }}"
          - alias: Set the early period length
            action: number.set_value
            target:
              entity_id: "{{ override_period }}"
            data:
              value: "{{ stage_1_minutes }}"
          - alias: Apply override
            action: button.press
            target:
              entity_id: "{{ override_apply }}"
      - alias: Run period 3 until its usual start
        conditions:
          - condition: template
            value_template: "{{ timer_ended and shift }}"
          - alias: Period 3 has a temperature
            condition: template
            value_template: "{{ periods[2].temp is not none }}"
          - alias: Still at least a minute before period 3
            condition: template
            value_template: >-
              {{ (today_at(periods[2].time) - now()).total_seconds() >= 60 }}
          - alias: The Timer that ended was ours (target was the period 2 temperature)
            condition: template
            value_template: >-
              {{ states(override_target) | float(none) == periods[1].temp }}
          - alias: Someone is in the house
            condition: occupancy.is_detected
            target:
              area_id: !input home_areas
            options:
              behavior: any
              for: "00:00:00"
        sequence:
          - alias: Set override mode to Timer
            action: select.select_option
            target:
              entity_id: "{{ override_mode }}"
            data:
              option: Timer
          - alias: Set period 3 temperature
            action: number.set_value
            target:
              entity_id: "{{ override_target }}"
            data:
              value: "{{ periods[2].temp }}"
          - alias: Run until period 3 starts
            action: number.set_value
            target:
              entity_id: "{{ override_period }}"
            data:
              value: >-
                {{ min(((today_at(periods[2].time) - now()).total_seconds() / 60)
                   | round(0) | int, 1439) }}
          - alias: Apply override
            action: button.press
            target:
              entity_id: "{{ override_apply }}"
      - alias: Heated areas occupied, Schedule 1
        conditions:
          - condition: occupancy.is_detected
            target:
              area_id: !input heated_areas
            options:
              behavior: any
              for: !input detect_delay
          - alias: No override running
            condition: template
            value_template: "{{ states(override_state) not in ['Boost', 'Timer'] }}"
        sequence:
          - action: select.select_option
            target:
              entity_id: "{{ schedule_group }}"
            data:
              option: Schedule 1
      - alias: Nobody home, end override and set Schedule 3
        conditions:
          - condition: zone.occupancy_is_not_detected
            options:
              for: "00:00:00"
              zone: !input home_zone
          - condition: occupancy.is_not_detected
            target:
              area_id: !input home_areas
            options:
              behavior: all
              for: !input clear_delay
        sequence:
          - if:
              - condition: template
                value_template: "{{ states(override_state) in ['Boost', 'Timer'] }}"
            then:
              - alias: End the override
                action: button.press
                target:
                  entity_id: "{{ override_exit }}"
          - action: select.select_option
            target:
              entity_id: "{{ schedule_group }}"
            data:
              option: Schedule 3
      - alias: Heated areas clear, Schedule 2
        conditions:
          - condition: occupancy.is_not_detected
            target:
              area_id: !input heated_areas
            options:
              behavior: all
              for: !input clear_delay
          - alias: No override running
            condition: template
            value_template: "{{ states(override_state) not in ['Boost', 'Timer'] }}"
        sequence:
          - action: select.select_option
            target:
              entity_id: "{{ schedule_group }}"
            data:
              option: Schedule 2
