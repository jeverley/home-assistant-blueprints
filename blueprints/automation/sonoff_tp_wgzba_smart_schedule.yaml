blueprint:
  name: Sonoff TP-WGZBA smart schedule
  description: |
    Smart scheduling for a Sonoff TP-WGZBA thermostat on ZHA, using the schedules stored on the thermostat.

    **Occupancy** switches the thermostat between its schedule groups:
    - **Schedule 1** while the heated areas are occupied.
    - **Schedule 2** when the heated areas are empty. A running Boost or Timer override is left alone.
    - **Schedule 3** when nobody is home. Any running override is ended first.

    **Routine** moves the start of the morning heating to match the next waking alarm:
    - An **early alarm** starts today's schedule early, at its own temperatures.
    - A **late alarm** keeps the night temperature until shortly before it.
    - Someone **up early**, reported by the wake sensor, starts it straight away, alarm or not.
  domain: automation
  source_url: https://raw.githubusercontent.com/jeverley/home-assistant-blueprints/main/blueprints/automation/sonoff_tp_wgzba_smart_schedule.yaml
  homeassistant:
    min_version: 2026.10.0
  input:
    thermostat:
      name: Thermostat
      icon: mdi:thermostat
      collapsed: false
      input:
        thermostat_device:
          name: Thermostat device
          description: The thermostat whose schedule this automation manages.
          selector:
            device:
              filter:
                - integration: zha
                  manufacturer: SONOFF
                  model: TP-WGZBA
    occupancy:
      name: Occupancy
      icon: mdi:home-account
      description: Where this thermostat looks for people, and how long to wait before switching schedule group.
      collapsed: false
      input:
        heated_areas:
          name: Heated areas
          description: The areas this thermostat heats.
          selector:
            area:
              multiple: true
        home_areas:
          name: Home areas
          description: The areas that count as someone being home.
          selector:
            area:
              multiple: true
        home_zone:
          name: Home zone
          description: The zone that shows whether anyone is home.
          default: zone.home
          selector:
            entity:
              filter:
                - domain: zone
        detect_delay:
          name: Occupied delay
          description: The duration the heated areas must be occupied before switching to Schedule 1.
          default:
            hours: 0
            minutes: 1
            seconds: 0
          selector:
            duration: {}
        clear_delay:
          name: Empty delay
          description: The duration areas must be empty before switching to Schedule 2, or to Schedule 3 when nobody is home.
          default:
            hours: 0
            minutes: 5
            seconds: 0
          selector:
            duration: {}
    routine:
      name: Routine
      icon: mdi:alarm
      description: >-
        Moves the start of the morning heating to match the next waking alarm,
        earlier or later than the schedule, or to when the wake sensor reports
        someone up. It only runs while someone is in the home areas.
      collapsed: false
      input:
        alarm_sensor:
          name: Next waking alarm sensor
          description: The sensor with the time of the next waking alarm, such as a phone's next alarm sensor.
          selector:
            entity:
              filter:
                - domain: sensor
        prewarm_lead:
          name: Lead time
          description: The time before the alarm when the morning heating starts.
          default: 30
          selector:
            number:
              min: 5
              max: 120
              step: 5
              unit_of_measurement: min
              mode: box
        wake_sensors:
          name: Wake sensor
          description: >-
            A binary sensor or toggle that turns on when someone is up in the
            morning, such as a helper built from your motion sensors. Starts the
            morning heating like an early alarm. Limit the hours it can turn on in
            the sensor itself. Leave empty to only follow the alarm.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - binary_sensor
                    - input_boolean
        wake_duration:
          name: Wake duration
          description: >-
            The duration the wake sensor must stay on to count. Leave at zero if the
            sensor already accounts for this.
          default:
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration: {}

mode: queued
max: 10
max_exceeded: silent

trigger_variables:
  thermostat_device: !input thermostat_device
  alarm_sensor: !input alarm_sensor
  prewarm_lead: !input prewarm_lead
  wake_sensors: !input wake_sensors

variables:
  # The thermostat's ZHA entities, matched on the device by domain and
  # default entity ID ending.
  thermostat_entities: "{{ device_entities(thermostat_device) }}"
  schedule_group: >-
    {{ thermostat_entities | select('match', '^select\\..*_schedule_group$') | first | default('') }}
  operating_day: >-
    {{ thermostat_entities | select('match', '^select\\..*_schedule_operating_day$') | first | default('') }}
  fetch_button: >-
    {{ thermostat_entities | select('match', '^button\\..*_schedule_fetch$') | first | default('') }}
  apply_button: >-
    {{ thermostat_entities | select('match', '^button\\..*_schedule_apply$') | first | default('') }}
  period_entities: >-
    {{ thermostat_entities
       | select('match', '^(select|number)\\..*_schedule_period_[0-9]+_(time|temp)$') | list }}
  override_mode: >-
    {{ thermostat_entities | select('match', '^select\\..*_override_mode$') | first | default('') }}
  override_target: >-
    {{ thermostat_entities | select('match', '^number\\..*_override_target_temperature$') | first | default('') }}
  override_period: >-
    {{ thermostat_entities | select('match', '^number\\..*_override_period$') | first | default('') }}
  override_apply: >-
    {{ thermostat_entities | select('match', '^button\\..*_override_apply$') | first | default('') }}
  override_exit: >-
    {{ thermostat_entities | select('match', '^button\\..*_override_exit$') | first | default('') }}
  override_state: >-
    {{ thermostat_entities | select('match', '^sensor\\..*_override_mode$') | first | default('') }}
  alarm_sensor: !input alarm_sensor
  prewarm_lead: !input prewarm_lead
  heated_areas: !input heated_areas
  home_areas: !input home_areas

triggers:
  - alias: Heated areas occupied
    trigger: occupancy.detected
    target:
      area_id: !input heated_areas
    options:
      behavior: first
      for: !input detect_delay
  - alias: Heated areas empty
    trigger: occupancy.cleared
    target:
      area_id: !input heated_areas
    options:
      behavior: all
      for: !input clear_delay
  - alias: Home areas empty
    trigger: occupancy.cleared
    target:
      area_id: !input home_areas
    options:
      behavior: all
      for: !input clear_delay
  - alias: Home zone occupied
    trigger: zone.occupancy_detected
    options:
      for: "00:00:00"
      zone: !input home_zone
  - alias: Home zone empty
    trigger: zone.occupancy_cleared
    options:
      for: "00:00:00"
      zone: !input home_zone
  - alias: Schedule group came back
    trigger: template
    value_template: >-
      {% set e = device_entities(thermostat_device)
           | select('match', '^select\\..*_schedule_group$') | first | default('') %}
      {{ e != '' and states(e) not in ['unavailable', 'unknown'] }}
  - alias: Early start window opened
    trigger: template
    id: prewarm
    value_template: >-
      {% set a = states(alarm_sensor) | as_datetime(none) %}
      {{ a is not none and a - timedelta(minutes=prewarm_lead | int) <= now() < a }}
  # Reads the period 2 time from the last fetch, so it can fire just before
  # period 2 starts when the alarm is later than usual.
  - alias: Late start hold due
    trigger: template
    id: late-hold
    value_template: >-
      {% set a = states(alarm_sensor) | as_datetime(none) %}
      {% set p = device_entities(thermostat_device)
           | select('match', '^select\\..*_schedule_period_2_time$') | first | default('') %}
      {% set s = states(p) if p != '' else '' %}
      {% if a is none or s is not match('^[0-9]{2}:[0-9]{2}') %}{{ false }}{% else %}
      {% set start = (a | as_local) - timedelta(minutes=prewarm_lead | int) %}
      {% set p2 = today_at(s[:5]) %}
      {{ start.date() == now().date() and p2 < start
         and p2 - timedelta(minutes=1) <= now() < start }}
      {% endif %}
  # Any wake sensor on, held for the wake duration.
  - alias: Someone is up
    trigger: template
    id: wake
    value_template: "{{ wake_sensors | select('is_state', 'on') | list | count > 0 }}"
    for: !input wake_duration
  - alias: Timer override ended
    trigger: template
    id: override-ended
    value_template: >-
      {% set e = device_entities(thermostat_device)
           | select('match', '^sensor\\..*_override_mode$') | first | default('') %}
      {{ e != '' and is_state(e, 'Idle') }}
  # The early or late window may already be open when Home Assistant starts or
  # automations reload, so the template triggers above would not fire.
  - alias: Home Assistant started
    trigger: homeassistant
    id: catch-up
    event: start
  - alias: Automations reloaded
    trigger: event
    id: catch-up
    event_type: automation_reloaded
  # Refreshes the fetched schedule for the new day, for the late start trigger.
  - alias: New day
    trigger: time
    id: new-day
    at: "00:01:00"

conditions: []

actions:
  - alias: Stop if the device is missing an entity
    if:
      - condition: template
        value_template: >-
          {{ '' in [schedule_group, operating_day, fetch_button, override_mode,
                    override_target, override_period, override_apply,
                    override_exit, override_state] }}
    then:
      - stop: >-
          Could not find every schedule and override entity on the thermostat. Check the
          entity IDs still end with their default names.
        error: true
  - alias: Stop if no heated or home areas are set
    if:
      - condition: template
        value_template: "{{ heated_areas | count == 0 or home_areas | count == 0 }}"
    then:
      - stop: Set at least one heated area and one home area.
        error: true
  - variables:
      # The template trigger fires on any change to Idle; only Timer counts.
      timer_ended: >-
        {{ trigger.id == 'override-ended' and trigger.from_state is not none
           and trigger.from_state.state == 'Timer' }}
  # Fetching selects today as the operating day, which would replace a day
  # being edited in the UI. If a person changed the operating day or a period
  # in the last 2 minutes, wait until they have stopped for 2 minutes. Changes
  # from a person carry a user; restarts and automations do not. Give up
  # after 15 minutes without fetching.
  - alias: Wait while someone is editing the schedule
    if:
      - condition: template
        value_template: >-
          {{ trigger.id in ['prewarm', 'late-hold', 'override-ended', 'catch-up', 'wake', 'new-day']
             and expand([operating_day] + period_entities)
                 | selectattr('last_changed', 'ge', now() - timedelta(minutes=2))
                 | selectattr('context.user_id', 'ne', none) | list | count > 0 }}
    then:
      - wait_template: >-
          {{ expand([operating_day] + period_entities)
             | selectattr('last_changed', 'ge', now() - timedelta(minutes=2))
             | selectattr('context.user_id', 'ne', none) | list | count == 0 }}
        timeout: "00:15:00"
        continue_on_timeout: false
  - variables:
      # The selects already hold today's schedule for the active group: fetched
      # today, after the last group change and schedule apply, with today
      # selected and no edits to the periods since.
      schedule_fresh: >-
        {% set f = states(fetch_button) | as_datetime(none) %}
        {% set applied = states(apply_button) | as_datetime(none) if apply_button != '' else none %}
        {{ f is not none and f >= today_at('00:00')
           and f >= states[schedule_group].last_changed
           and (applied is none or applied < f)
           and is_state(operating_day, now().strftime('%A'))
           and expand(period_entities)
               | selectattr('last_changed', 'gt', f + timedelta(seconds=30))
               | selectattr('context.user_id', 'ne', none) | list | count == 0 }}
  # Fetch today's schedule for the active group on runs that use it, unless the
  # selects are already current. For routine triggers a failed fetch stops the
  # run, so the routine fails closed. The new day refresh only keeps the period
  # times current for the late start trigger, so a failure there is tolerated.
  - alias: Get today's schedule
    choose:
      - alias: Fetch it
        conditions:
          - condition: template
            value_template: >-
              {{ trigger.id in ['prewarm', 'late-hold', 'override-ended', 'catch-up', 'wake']
                 and not schedule_fresh }}
        sequence:
          - alias: Select today as the operating day
            action: select.select_option
            target:
              entity_id: "{{ operating_day }}"
            data:
              option: "{{ now().strftime('%A') }}"
          # The press returns once the device has replied, so no wait is needed.
          - alias: Fetch the active schedule
            action: button.press
            target:
              entity_id: "{{ fetch_button }}"
      - alias: Refresh it for the new day
        conditions:
          - condition: template
            value_template: "{{ trigger.id == 'new-day' and not schedule_fresh }}"
        sequence:
          - alias: Select today as the operating day
            continue_on_error: true
            action: select.select_option
            target:
              entity_id: "{{ operating_day }}"
            data:
              option: "{{ now().strftime('%A') }}"
          - alias: Fetch the active schedule
            continue_on_error: true
            action: button.press
            target:
              entity_id: "{{ fetch_button }}"
  - alias: Read the configured periods and today's routine start
    variables:
      # Periods in order as {time, temp}, stopping at the first unset (NULL)
      # time. Period 1 is fixed at 00:00. A missing temperature is none.
      periods: >-
        {% set ns = namespace(out=[], open=true) %}
        {% for i in range(1, 13) %}
          {% set t = thermostat_entities
               | select('match', '^select\\..*_schedule_period_' ~ i ~ '_time$')
               | first | default('') %}
          {% set p = thermostat_entities
               | select('match', '^number\\..*_schedule_period_' ~ i ~ '_temp$')
               | first | default('') %}
          {% set s = states(t) if t != '' else '' %}
          {% if ns.open and s is match('^[0-9]{2}:[0-9]{2}') %}
            {% set ns.out = ns.out + [{'time': s[:5], 'temp': states(p) | float(none)}] %}
          {% else %}
            {% set ns.open = false %}
          {% endif %}
        {% endfor %}
        {{ ns.out }}
      # With 4 or more periods, period 3 is daytime heating, so an early start
      # shifts the morning earlier. With 2 or 3, period 3 (if any) is the
      # evening setback, so period 2 is only started early.
      shift: "{{ periods | count >= 4 }}"
      # Any wake sensor is on.
      wake_on: "{{ wake_sensors | select('is_state', 'on') | list | count > 0 }}"
      # Someone is up. Its trigger only fires when a wake sensor turns on, so
      # catch-up and late start runs also count one that is already on.
      woke: "{{ trigger.id == 'wake' or (trigger.id in ['catch-up', 'late-hold'] and wake_on) }}"
      # Alarm minus lead time, when the alarm is today and still ahead.
      # Otherwise blank.
      alarm_start: >-
        {% set a = states(alarm_sensor) | as_datetime(none) %}
        {% if a is none %}{{ '' }}{% else %}
        {% set a = a | as_local %}
        {% set start = a - timedelta(minutes=prewarm_lead | int) %}
        {{ start.isoformat() if start.date() == now().date() and now() < a else '' }}
        {% endif %}
      # The routine start: now if someone is up before the alarm start (or
      # with no alarm), otherwise the alarm start.
      routine_start: >-
        {% if woke and (alarm_start == '' or now() < alarm_start | as_datetime) %}{{ now().isoformat() }}{% else %}{{ alarm_start }}{% endif %}
      # The routine stage chosen below: a Timer at stage_temp for stage_minutes,
      # after ending the running override first if stage_exit is true.
      stage: ""
      stage_temp: 0
      stage_minutes: 0
      stage_exit: false
  - alias: Choose the routine stage
    choose:
      - alias: Early alarm or someone up, start period 2 early
        conditions:
          - alias: The routine start has been reached
            condition: template
            value_template: >-
              {{ (trigger.id in ['prewarm', 'catch-up'] or woke) and routine_start != ''
                 and (routine_start | as_datetime) <= now() }}
          - alias: Period 2 is set and warmer than period 1
            condition: template
            value_template: >-
              {{ periods | count >= 2
                 and periods[0].temp is not none and periods[1].temp is not none
                 and periods[1].temp > periods[0].temp
                 and (not shift or periods[2].temp is not none) }}
          - alias: At least a minute before period 2
            condition: template
            value_template: >-
              {{ (today_at(periods[1].time) - now()).total_seconds() >= 60 }}
          - alias: No override already running
            condition: template
            value_template: "{{ states(override_state) not in ['Boost', 'Timer'] }}"
          - alias: Someone is in the home areas
            condition: occupancy.is_detected
            target:
              area_id: !input home_areas
            options:
              behavior: any
              for: "00:00:00"
        sequence:
          # Shift: run period 2 for its usual length from the routine start.
          # Otherwise: run period 2 until its usual start.
          - variables:
              stage: early
              stage_temp: "{{ periods[1].temp }}"
              stage_minutes: >-
                {% set start = routine_start | as_datetime %}
                {% set p2 = today_at(periods[1].time) %}
                {% set end = start + (today_at(periods[2].time) - p2) if shift else p2 %}
                {{ min(((end - now()).total_seconds() / 60) | round(0) | int, 1439) }}
      - alias: Late alarm, hold period 1 past period 2's start
        conditions:
          - alias: Triggered for a late start, and nobody is up yet
            condition: template
            value_template: >-
              {{ trigger.id in ['late-hold', 'catch-up'] and not woke
                 and routine_start != '' }}
          - alias: Period 2 is set and warmer than period 1
            condition: template
            value_template: >-
              {{ periods | count >= 2
                 and periods[0].temp is not none and periods[1].temp is not none
                 and periods[1].temp > periods[0].temp }}
          - alias: Period 2 is due, and the routine start is at least a minute later
            condition: template
            value_template: >-
              {% set start = routine_start | as_datetime %}
              {% set p2 = today_at(periods[1].time) %}
              {{ p2 < start and now() >= p2 - timedelta(minutes=1)
                 and (start - now()).total_seconds() >= 60 }}
          - alias: No override already running
            condition: template
            value_template: "{{ states(override_state) not in ['Boost', 'Timer'] }}"
          - alias: Someone is in the home areas
            condition: occupancy.is_detected
            target:
              area_id: !input home_areas
            options:
              behavior: any
              for: "00:00:00"
        sequence:
          # Hold until the routine start. With 4 or more periods, period 2
          # then runs for its usual length (a later stage).
          - variables:
              stage: late-hold
              stage_temp: "{{ periods[0].temp }}"
              stage_minutes: >-
                {% set start = routine_start | as_datetime %}
                {{ min(((start - now()).total_seconds() / 60) | round(0) | int, 1439) }}
      - alias: Someone up during a late hold, end it
        conditions:
          - condition: template
            value_template: "{{ woke }}"
          - alias: A late alarm is still ahead
            condition: template
            value_template: >-
              {{ alarm_start != '' and now() < alarm_start | as_datetime }}
          - alias: Our late hold is running (Timer at the period 1 temperature)
            condition: template
            value_template: >-
              {{ periods | count >= 2 and periods[0].temp is not none
                 and periods[1].temp is not none
                 and is_state(override_state, 'Timer')
                 and states(override_target) | float(none) == periods[0].temp
                 and now() >= today_at(periods[1].time) - timedelta(minutes=1) }}
          - alias: Someone is in the home areas
            condition: occupancy.is_detected
            target:
              area_id: !input home_areas
            options:
              behavior: any
              for: "00:00:00"
        sequence:
          # With 2 or 3 periods the device's period 2 carries on once the hold
          # ends. With 4 or more, run period 2 for its usual length from now,
          # never past period 4.
          - variables:
              stage: wake-in-hold
              stage_exit: true
              stage_temp: "{{ periods[1].temp }}"
              stage_minutes: >-
                {% if not shift %}0{% else %}
                {% set p2 = today_at(periods[1].time) %}
                {% set end = now() + (today_at(periods[2].time) - p2) %}
                {% if periods | count >= 4 %}{% set end = min(end, today_at(periods[3].time)) %}{% endif %}
                {{ min(((end - now()).total_seconds() / 60) | round(0) | int, 1439) }}
                {% endif %}
      - alias: Early alarm, run period 3 until its usual start
        conditions:
          - condition: template
            value_template: "{{ timer_ended and shift }}"
          - alias: No override running now (another may have started since)
            condition: template
            value_template: "{{ states(override_state) not in ['Boost', 'Timer'] }}"
          - alias: Period 3 has a temperature
            condition: template
            value_template: "{{ periods[2].temp is not none }}"
          - alias: Still at least a minute before period 3
            condition: template
            value_template: >-
              {{ (today_at(periods[2].time) - now()).total_seconds() >= 60 }}
          - alias: The Timer that ended was our early start (period 2's temperature, for period 2's usual length)
            condition: template
            value_template: >-
              {% set ran = (now() - trigger.from_state.last_changed).total_seconds() %}
              {% set usual = (today_at(periods[2].time) - today_at(periods[1].time)).total_seconds() %}
              {{ states(override_target) | float(none) == periods[1].temp
                 and (ran - usual) | abs <= 120 }}
          - alias: Someone is in the home areas
            condition: occupancy.is_detected
            target:
              area_id: !input home_areas
            options:
              behavior: any
              for: "00:00:00"
        sequence:
          - variables:
              stage: early-follow-on
              stage_temp: "{{ periods[2].temp }}"
              stage_minutes: >-
                {{ min(((today_at(periods[2].time) - now()).total_seconds() / 60)
                   | round(0) | int, 1439) }}
      - alias: Late alarm, run period 2 for its usual length
        conditions:
          - condition: template
            value_template: "{{ timer_ended and shift and alarm_start != '' }}"
          - alias: No override running now (another may have started since)
            condition: template
            value_template: "{{ states(override_state) not in ['Boost', 'Timer'] }}"
          - alias: Period 2 has a temperature
            condition: template
            value_template: "{{ periods[1].temp is not none }}"
          - alias: The Timer that ended was our late hold (period 1's temperature, ending at the alarm start)
            condition: template
            value_template: >-
              {{ periods[0].temp is not none
                 and states(override_target) | float(none) == periods[0].temp
                 and ((now() - alarm_start | as_datetime).total_seconds()) | abs <= 120 }}
          - alias: The alarm start is after period 2's usual start, and period 2 has time left
            condition: template
            value_template: >-
              {% set start = alarm_start | as_datetime %}
              {% set p2 = today_at(periods[1].time) %}
              {% set end = start + (today_at(periods[2].time) - p2) %}
              {{ p2 < start and now() >= p2 and (end - now()).total_seconds() >= 60 }}
          - alias: Someone is in the home areas
            condition: occupancy.is_detected
            target:
              area_id: !input home_areas
            options:
              behavior: any
              for: "00:00:00"
        sequence:
          # Period 2's usual length from the alarm start, but never past period
          # 4 (usually the evening setback).
          - variables:
              stage: late-follow-on
              stage_temp: "{{ periods[1].temp }}"
              stage_minutes: >-
                {% set start = alarm_start | as_datetime %}
                {% set p2 = today_at(periods[1].time) %}
                {% set end = start + (today_at(periods[2].time) - p2) %}
                {% if periods | count >= 4 %}{% set end = min(end, today_at(periods[3].time)) %}{% endif %}
                {{ min(((end - now()).total_seconds() / 60) | round(0) | int, 1439) }}
  - alias: Apply the routine stage, or switch schedule group
    if:
      - condition: template
        value_template: "{{ stage != '' }}"
    then:
      - alias: End the running override first
        if:
          - condition: template
            value_template: "{{ stage_exit }}"
        then:
          - alias: End the override
            action: button.press
            target:
              entity_id: "{{ override_exit }}"
          # Let the device report Idle before a new Timer, so the queued run
          # from that Idle sees the new Timer and leaves it alone.
          - wait_template: "{{ is_state(override_state, 'Idle') }}"
            timeout: "00:00:10"
            continue_on_timeout: true
      - alias: Start the stage as a Timer override
        if:
          - condition: template
            value_template: "{{ stage_minutes >= 1 }}"
        then:
          - alias: Set override mode to Timer
            action: select.select_option
            target:
              entity_id: "{{ override_mode }}"
            data:
              option: Timer
          - alias: Set the stage temperature
            action: number.set_value
            target:
              entity_id: "{{ override_target }}"
            data:
              value: "{{ stage_temp }}"
          - alias: Set the stage length
            action: number.set_value
            target:
              entity_id: "{{ override_period }}"
            data:
              value: "{{ stage_minutes }}"
          - alias: Apply override
            action: button.press
            target:
              entity_id: "{{ override_apply }}"
          - wait_template: "{{ is_state(override_state, 'Timer') }}"
            timeout: "00:00:10"
            continue_on_timeout: true
    else:
      - choose:
          - alias: Heated areas occupied, Schedule 1
            conditions:
              - condition: occupancy.is_detected
                target:
                  area_id: !input heated_areas
                options:
                  behavior: any
                  for: !input detect_delay
              - alias: No override running
                condition: template
                value_template: "{{ states(override_state) not in ['Boost', 'Timer'] }}"
            sequence:
              - action: select.select_option
                target:
                  entity_id: "{{ schedule_group }}"
                data:
                  option: Schedule 1
          - alias: Nobody home, end override and set Schedule 3
            conditions:
              - condition: zone.occupancy_is_not_detected
                options:
                  for: "00:00:00"
                  zone: !input home_zone
              - condition: occupancy.is_not_detected
                target:
                  area_id: !input home_areas
                options:
                  behavior: all
                  for: !input clear_delay
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ states(override_state) in ['Boost', 'Timer'] }}"
                then:
                  - alias: End the override
                    action: button.press
                    target:
                      entity_id: "{{ override_exit }}"
              - action: select.select_option
                target:
                  entity_id: "{{ schedule_group }}"
                data:
                  option: Schedule 3
          - alias: Heated areas clear, Schedule 2
            conditions:
              - condition: occupancy.is_not_detected
                target:
                  area_id: !input heated_areas
                options:
                  behavior: all
                  for: !input clear_delay
              - alias: No override running
                condition: template
                value_template: "{{ states(override_state) not in ['Boost', 'Timer'] }}"
            sequence:
              - action: select.select_option
                target:
                  entity_id: "{{ schedule_group }}"
                data:
                  option: Schedule 2
